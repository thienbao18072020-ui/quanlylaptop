<script>
// ============================================================================
// 1. DỮ LIỆU & TRẠNG THÁI HỆ THỐNG
// ============================================================================
const STORAGE_KEY = 'vntech_it_3mien_v26';

const REGION_INFO = {
    'Miền Bắc': {
        branches: ['Lô D3, KCN Đại Đồng - Hoàn Sơn, Xã Đại Đồng, Tỉnh Bắc Ninh'],
        itManager: 'Bắc IT (0945633345), Bình IT (0939348848)'
    },
    'Miền Trung': {
        branches: ['Thôn Phong Nam, Quốc Lộ 1A, Phường Hoà Xuân, TP. Đà Nẵng'],
        itManager: 'Bắc IT (0945633345), Bình IT (0939348848)'
    },
    'Miền Nam': {
        branches: ['18/49 Quốc Lộ 1A, Khu Phố 1, Phường Bình Hưng Hoà, TP.HCM'],
        itManager: 'Bắc IT (0945633345), Bình IT (0939348848)'
    }
};

let computers = [];
let repairs = [];
let employees = [
    { id: 'TV001', name: 'Bắc IT', username: 'bacit', password: '123', dept: 'Hạ tầng IT', role: 'Quản trị viên', email: 'bac.it@vntech.vn', phone: '0945633345', region: 'Miền Bắc', status: 'Đang hoạt động', registeredAt: '2026-01-01' },
    { id: 'TV002', name: 'Bình IT', username: 'binhit', password: '123', dept: 'Kỹ thuật IT', role: 'Quản trị viên', email: 'binh.it@vntech.vn', phone: '0939348848', region: 'Miền Nam', status: 'Đang hoạt động', registeredAt: '2026-01-01' }
];
let currentUser = null;
let currentPage = 'dashboard';
let computerFilter = { search: '', region: 'ALL', status: 'ALL' };
let activeCharts = [];

const MANAGED_STATUSES = ['Đang sửa', 'Sửa xong', 'Gửi trả chi nhánh', 'Gửi nhà cung cấp', 'Thanh lý'];

// ============================================================================
// 2. LƯU TRỮ & PHÂN QUYỀN
// ============================================================================
function loadState() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed.computers)) computers = parsed.computers;
            if (Array.isArray(parsed.repairs)) repairs = parsed.repairs;
            if (Array.isArray(parsed.employees) && parsed.employees.length > 0) employees = parsed.employees;
            if (parsed.currentUser) currentUser = parsed.currentUser;
        }
    } catch (e) {
        console.warn('Không thể tải dữ liệu lưu trữ:', e);
    }
}

function saveState() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
            computers,
            repairs,
            employees,
            currentUser
        }));
    } catch (e) {
        console.warn('Không thể lưu dữ liệu:', e);
    }
}

function isAdmin() {
    return currentUser && currentUser.role === 'Quản trị viên';
}

function requireAdmin() {
    if (!isAdmin()) {
        showToast('Chỉ Quản trị viên mới được phép thực hiện thao tác này!', 'error');
        return false;
    }
    return true;
}

// ============================================================================
// 3. TIỆN ÍCH UI (TOAST, MODAL, SIDEBAR, FORMAT)
// ============================================================================
function showToast(message, type = 'info') {
    const container = document.getElementById('toast-container');
    if (!container) return;
    const colors = {
        success: 'bg-emerald-600 text-white',
        error: 'bg-rose-600 text-white',
        warning: 'bg-amber-500 text-white',
        info: 'bg-slate-800 text-white'
    };
    const toast = document.createElement('div');
    toast.className = `pointer-events-auto px-4 py-3 rounded-2xl shadow-lg text-xs font-bold flex items-center gap-2 transition-all transform translate-y-0 ${colors[type] || colors.info}`;
    toast.textContent = message;
    container.appendChild(toast);
    setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

function openModal(title, htmlContent) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-body').innerHTML = htmlContent;
    const backdrop = document.getElementById('modal-backdrop');
    backdrop.classList.remove('hidden');
    backdrop.classList.add('flex');
}

function closeModal() {
    const backdrop = document.getElementById('modal-backdrop');
    backdrop.classList.add('hidden');
    backdrop.classList.remove('flex');
}

function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    sidebar.classList.toggle('-translate-x-full');
    overlay.classList.toggle('hidden');
}

function formatMoney(num) {
    const val = Number(num) || 0;
    return val.toLocaleString('vi-VN') + ' đ';
}

function getStatusBadge(status) {
    const map = {
        'Đang sửa': 'bg-amber-100 text-amber-800 border-amber-200',
        'Sửa xong': 'bg-emerald-100 text-emerald-800 border-emerald-200',
        'Gửi trả chi nhánh': 'bg-blue-100 text-blue-800 border-blue-200',
        'Gửi nhà cung cấp': 'bg-purple-100 text-purple-800 border-purple-200',
        'Thanh lý': 'bg-slate-200 text-slate-800 border-slate-300'
    };
    const cls = map[status] || 'bg-slate-100 text-slate-700 border-slate-200';
    return `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-[11px] font-bold border ${cls}">${status}</span>`;
}

function updateHeaderUserUI() {
    const nameEl = document.getElementById('header-user-name');
    const roleEl = document.getElementById('header-user-role');
    const avatarEl = document.getElementById('header-user-avatar');
    const authBtn = document.getElementById('header-auth-btn');
    const settingsNav = document.getElementById('nav-settings-btn');

    if (currentUser) {
        nameEl.textContent = currentUser.name;
        roleEl.textContent = currentUser.role;
        avatarEl.textContent = currentUser.name.slice(0, 2).toUpperCase();
        avatarEl.className = 'w-10 h-10 rounded-full bg-blue-100 text-blue-700 font-extrabold text-xs flex items-center justify-center ring-2 ring-white shadow-xs';
        authBtn.textContent = 'Đăng xuất';
        authBtn.onclick = logoutUser;
        authBtn.className = 'px-3.5 py-2 text-xs font-bold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-xl transition-all';
    } else {
        nameEl.textContent = 'Khách (Chưa đăng nhập)';
        roleEl.textContent = 'Chỉ xem số liệu';
        avatarEl.textContent = '?';
        avatarEl.className = 'w-10 h-10 rounded-full bg-slate-100 text-slate-600 font-extrabold text-xs flex items-center justify-center ring-2 ring-white shadow-xs';
        authBtn.textContent = 'Đăng ký / Đăng nhập';
        authBtn.onclick = () => openAuthModal('login');
        authBtn.className = 'px-3.5 py-2 text-xs font-bold text-white bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 rounded-xl shadow-xs transition-all';
    }

    if (settingsNav) {
        if (isAdmin()) {
            settingsNav.classList.remove('hidden');
        } else {
            settingsNav.classList.add('hidden');
            if (currentPage === 'settings') currentPage = 'dashboard';
        }
    }
}

function destroyCharts() {
    activeCharts.forEach(c => {
        try { c.destroy(); } catch (e) {}
    });
    activeCharts = [];
}

// ============================================================================
// 4. ĐIỀU HƯỚNG CÁC TRANG
// ============================================================================
function navigate(page) {
    if (page === 'settings' && !isAdmin()) {
        showToast('Bạn không có quyền truy cập Cài đặt Hệ thống!', 'error');
        page = 'dashboard';
    }
    currentPage = page;
    destroyCharts();

    document.querySelectorAll('.nav-item').forEach(btn => {
        if (btn.dataset.page === page) {
            btn.classList.add('bg-blue-50', 'text-blue-700', 'font-extrabold');
            btn.classList.remove('text-slate-600', 'hover:bg-slate-50');
        } else {
            btn.classList.remove('bg-blue-50', 'text-blue-700', 'font-extrabold');
            btn.classList.add('text-slate-600', 'hover:bg-slate-50');
        }
    });

    const sidebar = document.getElementById('sidebar');
    if (window.innerWidth < 1024 && !sidebar.classList.contains('-translate-x-full')) {
        toggleSidebar();
    }

    const main = document.getElementById('main-content');
    if (page === 'dashboard') main.innerHTML = renderDashboard();
    else if (page === 'computers') main.innerHTML = renderComputers();
    else if (page === 'repairs') main.innerHTML = renderRepairs();
    else if (page === 'regions') main.innerHTML = renderRegions();
    else if (page === 'employees') main.innerHTML = renderEmployees();
    else if (page === 'reports') {
        main.innerHTML = renderReports();
        initReportCharts();
    }
    else if (page === 'settings') main.innerHTML = renderSettings();
}

// ============================================================================
// 5. TRANG CHỦ (DASHBOARD)
// ============================================================================
function renderDashboard() {
    const total = computers.length;
    const repairing = computers.filter(c => c.status === 'Đang sửa').length;
    const done = computers.filter(c => c.status === 'Sửa xong').length;
    const returned = computers.filter(c => c.status === 'Gửi trả chi nhánh').length;
    const vendor = computers.filter(c => c.status === 'Gửi nhà cung cấp').length;
    const disposed = computers.filter(c => c.status === 'Thanh lý').length;

    const regions = ['Miền Bắc', 'Miền Trung', 'Miền Nam'];

    return `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
                <h2 class="text-xl font-extrabold text-slate-800">Tổng quan Hệ thống Máy tính 3 Miền</h2>
                <p class="text-xs text-slate-500 mt-0.5">Theo dõi trạng thái sửa chữa, bảo hành và điều phối thiết bị theo thời gian thực</p>
            </div>
            ${isAdmin() ? `
                <button onclick="openFaultyInputModal()" class="px-4 py-2.5 rounded-2xl bg-amber-500 hover:bg-amber-600 text-white font-extrabold text-xs shadow-sm transition-all flex items-center gap-2 self-start">
                    <span>⚠️</span> <span>NHẬP MÁY LỖI</span>
                </button>
            ` : `
                <span class="px-3.5 py-2 rounded-xl bg-slate-100 text-slate-600 text-xs font-semibold">
                    👁️ Chế độ chỉ xem số liệu
                </span>
            `}
        </div>

        <!-- KPI CARDS -->
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3.5">
            <div class="card-elevated p-4 rounded-2xl">
                <div class="text-[11px] font-bold text-slate-500 uppercase">Tổng thiết bị</div>
                <div class="text-2xl font-extrabold text-slate-800 mt-1">${total}</div>
            </div>
            <div class="card-elevated p-4 rounded-2xl border-l-4 border-l-amber-500">
                <div class="text-[11px] font-bold text-amber-700 uppercase">Đang sửa</div>
                <div class="text-2xl font-extrabold text-amber-600 mt-1">${repairing}</div>
            </div>
            <div class="card-elevated p-4 rounded-2xl border-l-4 border-l-emerald-500">
                <div class="text-[11px] font-bold text-emerald-700 uppercase">Sửa xong</div>
                <div class="text-2xl font-extrabold text-emerald-600 mt-1">${done}</div>
            </div>
            <div class="card-elevated p-4 rounded-2xl border-l-4 border-l-blue-500">
                <div class="text-[11px] font-bold text-blue-700 uppercase">Gửi trả CN</div>
                <div class="text-2xl font-extrabold text-blue-600 mt-1">${returned}</div>
            </div>
            <div class="card-elevated p-4 rounded-2xl border-l-4 border-l-purple-500">
                <div class="text-[11px] font-bold text-purple-700 uppercase">Gửi NCC</div>
                <div class="text-2xl font-extrabold text-purple-600 mt-1">${vendor}</div>
            </div>
            <div class="card-elevated p-4 rounded-2xl border-l-4 border-l-slate-500">
                <div class="text-[11px] font-bold text-slate-600 uppercase">Thanh lý</div>
                <div class="text-2xl font-extrabold text-slate-700 mt-1">${disposed}</div>
            </div>
        </div>

        <!-- 3 REGIONS SUMMARY -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            ${regions.map(reg => {
                const list = computers.filter(c => c.region === reg);
                const regRepair = list.filter(c => c.status === 'Đang sửa').length;
                const regDone = list.filter(c => c.status === 'Sửa xong').length;
                return `
                    <div class="card-elevated p-5 rounded-3xl space-y-3">
                        <div class="flex items-center justify-between">
                            <span class="font-extrabold text-slate-800 text-sm">🏢 ${reg}</span>
                            <span class="px-2.5 py-1 rounded-full bg-blue-50 text-blue-700 text-xs font-extrabold">${list.length} máy</span>
                        </div>
                        <p class="text-[11px] text-slate-500 leading-relaxed">${REGION_INFO[reg].branches[0]}</p>
                        <div class="pt-2 border-t border-slate-100 flex items-center justify-between text-xs">
                            <span class="text-amber-600 font-bold">Đang sửa: ${regRepair}</span>
                            <span class="text-emerald-600 font-bold">Sửa xong: ${regDone}</span>
                        </div>
                    </div>
                `;
            }).join('')}
        </div>

        <!-- RECENT DEVICES -->
        <div class="card-elevated rounded-3xl overflow-hidden">

                <button onclick="navigate('computers')" class="text-xs font-bold text-blue-600 hover:underline">Xem tất cả →</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                    <thead>
                        <tr class="bg-slate-50 text-slate-500 uppercase text-[11px] border-b border-slate-100">
                            <th class="py-3 px-4 font-bold">Mã số máy</th>
                            <th class="py-3 px-4 font-bold">Loại máy</th>
                            <th class="py-3 px-4 font-bold">Khách hàng</th>
                            <th class="py-3 px-4 font-bold">Chi nhánh</th>
                            <th class="py-3 px-4 font-bold">Tình trạng lỗi</th>
                            <th class="py-3 px-4 font-bold">Trạng thái</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                        ${computers.length === 0 ? `

                                <td class="py-3 px-4 font-extrabold text-blue-600">${c.code}</td>
                                <td class="py-3 px-4 font-bold text-slate-700">${c.model}</td>
                                <td class="py-3 px-4 text-slate-600">${c.customer || '—'}</td>
                                <td class="py-3 px-4 text-slate-600">${c.region}</td>

function renderComputers() {
    const countBy = (st) => computers.filter(c => c.status === st).length;

    const filtered = computers.filter(c => {
        const q = computerFilter.search.toLowerCase();
        const matchSearch = !q ||
            (c.code && c.code.toLowerCase().includes(q)) ||
            (c.model && c.model.toLowerCase().includes(q)) ||
            (c.customer && c.customer.toLowerCase().includes(q));
        const matchRegion = computerFilter.region === 'ALL' || c.region === computerFilter.region;
        const matchStatus = computerFilter.status === 'ALL' || c.status === computerFilter.status;
        return matchSearch && matchRegion && matchStatus;
    });

    const quickTabs = [
        { label: '🟡 Đang sửa', status: 'Đang sửa', count: countBy('Đang sửa'), cls: 'bg-amber-50/70 border-amber-200 text-amber-800' },
        { label: '🟢 Sửa xong', status: 'Sửa xong', count: countBy('Sửa xong'), cls: 'bg-emerald-50/70 border-emerald-200 text-emerald-800' },

        { label: '⚫ Thanh lý', status: 'Thanh lý', count: countBy('Thanh lý'), cls: 'bg-slate-100 border-slate-300 text-slate-800' }

                <button onclick="setComputerStatusFilter('${t.status}')" class="p-3.5 rounded-2xl border ${t.cls} ${computerFilter.status === t.status ? 'ring-2 ring-blue-500' : ''} flex items-center justify-between transition-all text-left">

                    <span class="text-base font-extrabold">${t.count}</span>

                <option value="Miền Bắc" ${computerFilter.region==='Miền Bắc'?'selected':''}>Miền Bắc</option>
                <option value="Miền Trung" ${computerFilter.region==='Miền Trung'?'selected':''}>Miền Trung</option>

                </table>

function setComputerStatusFilter(status) {
    computerFilter.status = (computerFilter.status === status) ? 'ALL' : status;

}

function submitFaultyMachine(e) {
    e.preventDefault();
    if (!requireAdmin()) return;

    const code = document.getElementById('fm-code').value.trim();
    if (!/^\d{1,5}$/.test(code)) {
        showToast('Mã số máy chỉ được gồm tối đa 5 chữ số!', 'error');
        return;
    }

    const newItem = {
        id: 'PC-' + Date.now(),
        code,
        model: document.getElementById('fm-model').value,
        customer: document.getElementById('fm-customer').value.trim(),
        region: document.getElementById('fm-region').value,
        issue: document.getElementById('fm-issue').value.trim(),
        note: document.getElementById('fm-note').value.trim(),
        cost: Number(document.getElementById('fm-cost').value) || 0,
        technician: document.getElementById('fm-tech').value,
        status: 'Đang sửa',
        createdAt: new Date().toISOString().split('T')[0]
    };

    computers.push(newItem);
    saveState();
    showToast(`Đã lưu tiếp nhận máy ${code} (${newItem.model})!`, 'success');
    closeModal();
    navigate(currentPage);
}

function saveComputerDetail(id) {
    if (!requireAdmin()) return;
    const c = computers.find(item => item.id === id);
    if (!c) return;

    const code = document.getElementById('det-code').value.trim();
    if (!/^\d{1,5}$/.test(code)) {
        showToast('Mã số máy chỉ được gồm tối đa 5 chữ số!', 'error');
        return;
    }

    c.code = code;
    c.model = document.getElementById('det-model').value;
    c.customer = document.getElementById('det-customer').value.trim();
    c.region = document.getElementById('det-region').value;
    c.status = document.getElementById('det-status').value;
    c.technician = document.getElementById('det-tech').value;
    c.cost = Number(document.getElementById('det-cost').value) || 0;
    c.issue = document.getElementById('det-issue').value.trim();
    c.note = document.getElementById('det-note').value.trim();

    saveState();
    showToast(`Đã cập nhật thông tin máy #${c.code}!`, 'success');
    closeModal();
    navigate(currentPage);
}

function deleteComputer(id) {
    if (!requireAdmin()) return;
    computers = computers.filter(c => c.id !== id);
    saveState();
    showToast('Đã xóa thiết bị khỏi danh sách!', 'info');
    closeModal();
    navigate(currentPage);
}

                            <div class="grid grid-cols-1 sm:grid-cols-4 gap-2">

function saveEmployeeEdit(empId) {
    if (!requireAdmin()) return;
    const emp = employees.find(e => e.id === empId);
    if (!emp) return;

    const nameEl = document.getElementById(`edit-emp-name-${empId}`);
    const passEl = document.getElementById(`edit-emp-pass-${empId}`);
    const roleEl = document.getElementById(`edit-emp-role-${empId}`);
    const phoneEl = document.getElementById(`edit-emp-phone-${empId}`);

    if (nameEl && nameEl.value.trim()) emp.name = nameEl.value.trim();
    if (passEl) emp.password = passEl.value.trim();
    if (roleEl) emp.role = roleEl.value;
    if (phoneEl) emp.phone = phoneEl.value.trim();

    if (currentUser && currentUser.id === empId) {
        currentUser = { ...emp };
        updateHeaderUserUI();
    }

    saveState();
    showToast(`Đã lưu cập nhật tài khoản ${emp.name}!`, 'success');
    if (currentPage === 'employees') navigate('employees');
}

function adminAddAccount(e) {
    e.preventDefault();
    if (!requireAdmin()) return;

    const name = document.getElementById('admin-add-name').value.trim();
    const username = document.getElementById('admin-add-username').value.trim().toLowerCase();
    const password = document.getElementById('admin-add-password').value.trim();
    const role = document.getElementById('admin-add-role').value;
    const region = document.getElementById('admin-add-region').value;
    const phone = document.getElementById('admin-add-phone').value.trim();
    const today = new Date().toISOString().split('T')[0];

    const newEmp = {
        id: 'TV' + String(employees.length + 1).padStart(3, '0'),
        name,
        username,
        password,
        role,
        phone,
        region,
        status: 'Đang hoạt động',
        registeredAt: today
    };

    employees.push(newEmp);
    saveState();
    showToast(`Đã thêm tài khoản ${name} (${role})!`, 'success');
    openManageAccountsModal();
    if (currentPage === 'employees') navigate('employees');
}

function deleteEmployeeAccount(empId) {
    if (!requireAdmin()) return;
    if (employees.length <= 1) {
        showToast('Không thể xóa tài khoản cuối cùng trên hệ thống!', 'error');
        return;
    }
    if (currentUser && currentUser.id === empId) {
        showToast('Không thể tự xóa tài khoản đang đăng nhập!', 'error');
        return;
    }
    employees = employees.filter(e => e.id !== empId);
    saveState();
    showToast('Đã xóa tài khoản thành công!', 'info');
    openManageAccountsModal();
    if (currentPage === 'employees') navigate('employees');
}

    return `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
                <h2 class="text-xl font-extrabold text-slate-800">Báo cáo Thống kê & Chi phí</h2>
                <p class="text-xs text-slate-500 mt-0.5">Phân tích tỷ trọng trạng thái xử lý và phân bổ thiết bị theo 3 miền</p>
            </div>
            <div class="px-4 py-2.5 rounded-2xl bg-blue-50 text-blue-800 text-xs font-extrabold">
                Tổng chi phí dự kiến: ${formatMoney(totalCost)}
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
            <div class="card-elevated p-5 rounded-3xl">
                <h3 class="font-extrabold text-slate-800 text-sm mb-4">Thống kê theo Trạng thái Xử lý</h3>
                <div class="h-64"><canvas id="chart-status"></canvas></div>
            </div>
            <div class="card-elevated p-5 rounded-3xl">
                <h3 class="font-extrabold text-slate-800 text-sm mb-4">Phân bổ Thiết bị theo 3 Miền</h3>
                <div class="h-64"><canvas id="chart-region"></canvas></div>
            </div>
        </div>
    `;
}

function initReportCharts() {
    if (typeof Chart === 'undefined') return;
    const statusCtx = document.getElementById('chart-status');
    const regionCtx = document.getElementById('chart-region');

    if (statusCtx) {
        activeCharts.push(new Chart(statusCtx, {
            type: 'doughnut',
            data: {
                labels: MANAGED_STATUSES,
                datasets: [{
                    data: MANAGED_STATUSES.map(st => computers.filter(c => c.status === st).length),
                    backgroundColor: ['#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#64748b']
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        }));
    }

    if (regionCtx) {
        const regs = ['Miền Bắc', 'Miền Trung', 'Miền Nam'];
        activeCharts.push(new Chart(regionCtx, {
            type: 'bar',
            data: {
                labels: regs,
                datasets: [{
                    label: 'Số lượng máy',
                    data: regs.map(r => computers.filter(c => c.region === r).length),
                    backgroundColor: ['#2563eb', '#0ea5e9', '#6366f1'],
                    borderRadius: 8
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
            }
        }));
    }
}

function openAuthModal(tab = 'login') {

                <button onclick="openAuthModal('register')" class="py-2 rounded-xl font-extrabold transition-all ${tab==='register' ? 'bg-white text-blue-600 shadow-xs' : 'text-slate-600'}">
                    Đăng ký mới
                </button>
            </div>

            ${tab === 'login' ? `
                <form onsubmit="submitAuthLogin(event)" class="space-y-4">
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Chọn tài khoản đã đăng ký</label>
                        <select id="login-account-id" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white focus:outline-none focus:border-blue-500 font-semibold">
                            ${employees.map(emp => `
                                <option value="${emp.id}">${emp.name} (${emp.role})</option>
                            `).join('')}
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Mật khẩu *</label>
                        <input type="password" id="login-account-password" required placeholder="Nhập mật khẩu (mặc định: 123)..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-blue-500">
                    </div>
                    <button type="submit" class="w-full py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-extrabold shadow-xs">
                        Đăng nhập vào hệ thống
                    </button>
                </form>
            ` : `
                <form onsubmit="submitAuthRegister(event)" class="space-y-3.5">
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Họ và tên hiển thị *</label>

                        <div>
                            <label class="block font-bold text-slate-700 mb-1">Mật khẩu *</label>
                            <input type="password" id="reg-password" required placeholder="Nhập mật khẩu..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-blue-500">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div>
                            <label class="block font-bold text-slate-700 mb-1">Số điện thoại</label>

function submitAuthLogin(e) {
    e.preventDefault();
    const accId = document.getElementById('login-account-id').value;
    const passInput = document.getElementById('login-account-password').value.trim();
    const found = employees.find(emp => emp.id === accId);
    if (!found) return;

    const expectedPass = found.password || '123';
    if (passInput !== expectedPass) {
        showToast('Mật khẩu không chính xác, vui lòng thử lại!', 'error');
        return;
    }

    currentUser = { ...found };
    saveState();
    updateHeaderUserUI();
    showToast(`Xin chào ${currentUser.name} (${currentUser.role})!`, 'success');
    closeModal();
    navigate(currentPage);
}

function submitAuthRegister(e) {
    e.preventDefault();
    const name = document.getElementById('reg-name').value.trim();
    const username = document.getElementById('reg-username').value.trim().toLowerCase();
    const password = document.getElementById('reg-password').value.trim();
    const phone = document.getElementById('reg-phone').value.trim();
    const role = document.getElementById('reg-role').value;
    const region = document.getElementById('reg-region').value;
    const today = new Date().toISOString().split('T')[0];

    const newEmp = {
        id: 'TV' + String(employees.length + 1).padStart(3, '0'),
        name,
        username,
        password,
        role,
        phone,
        region,
        status: 'Đang hoạt động',
        registeredAt: today
    };

    employees.push(newEmp);
    currentUser = { ...newEmp };
    saveState();
    updateHeaderUserUI();
    showToast(`Đăng ký thành công tài khoản ${name} (${role})!`, 'success');
    closeModal();
    navigate(currentPage);
}

function logoutUser() {
    currentUser = null;
    saveState();
    updateHeaderUserUI();
    showToast('Đã đăng xuất khỏi hệ thống.', 'info');
    navigate(currentPage);
}
