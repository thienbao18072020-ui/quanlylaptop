<script>
// ============================================================================
// 1. DỮ LIỆU & TRẠNG THÁI HỆ THỐNG
// ============================================================================
const STORAGE_KEY = 'vntech_it_3mien_v26';

const REGION_INFO = {
    'Miền Bắc': {
        branches: ['Lô D3, KCN Đại Đồng - Hoàn Sơn, Xã Đại Đồng, Tỉnh Bắc Ninh'],
        itManager: 'Bắc IT (0945633345), Bình IT (0939348848)'
    },
    'Miền Trung': {
        branches: ['Thôn Phong Nam, Quốc Lộ 1A, Phường Hoà Xuân, TP. Đà Nẵng'],
        itManager: 'Bắc IT (0945633345), Bình IT (0939348848)'
    },
    'Miền Nam': {
        branches: ['18/49 Quốc Lộ 1A, Khu Phố 1, Phường Bình Hưng Hoà, TP.HCM'],
        itManager: 'Bắc IT (0945633345), Bình IT (0939348848)'
    }
};

let computers = [];
let repairs = [];
let employees = [
    { id: 'TV001', name: 'Bắc IT', username: 'bacit', password: '123', dept: 'Hạ tầng IT', role: 'Quản trị viên', email: 'bac.it@vntech.vn', phone: '0945633345', region: 'Miền Bắc', status: 'Đang hoạt động', registeredAt: '2026-01-01' },
    { id: 'TV002', name: 'Bình IT', username: 'binhit', password: '123', dept: 'Kỹ thuật IT', role: 'Quản trị viên', email: 'binh.it@vntech.vn', phone: '0939348848', region: 'Miền Nam', status: 'Đang hoạt động', registeredAt: '2026-01-01' }
];
let currentUser = null;
let currentPage = 'dashboard';
let computerFilter = { search: '', region: 'ALL', status: 'ALL' };
let activeCharts = [];

const MANAGED_STATUSES = ['Chờ xử lý', 'Đang sửa', 'Sửa xong', 'Gửi trả chi nhánh', 'Gửi nhà cung cấp', 'Thanh lý'];

// ============================================================================
// 2. LƯU TRỮ & PHÂN QUYỀN
// ============================================================================
function loadData() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed.computers)) computers = parsed.computers;
            if (Array.isArray(parsed.repairs)) repairs = parsed.repairs;
            if (Array.isArray(parsed.employees) && parsed.employees.length > 0) employees = parsed.employees;
            if (parsed.currentUser) {
                const found = employees.find(e => e.id === parsed.currentUser.id);
                currentUser = found || null;
            }
        }
    } catch (e) {
        console.error('Lỗi đọc dữ liệu:', e);
    }
}

function saveData() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
            computers,
            repairs,
            employees,
            currentUser
        }));
    } catch (e) {
        console.error('Lỗi lưu dữ liệu:', e);
    }
}

function isAdmin() {
    return !!(currentUser && currentUser.role === 'Quản trị viên');
}

function requireAdmin() {
    if (!isAdmin()) {
        showToast('Chỉ Quản trị viên đã đăng nhập mới có quyền thực hiện thao tác này!', 'error');
        return false;
    }
    return true;
}

// ============================================================================
// 3. TIỆN ÍCH GIAO DIỆN (TOAST, MODAL, FORMAT)
// ============================================================================
function showToast(msg, type = 'success') {
    const container = document.getElementById('toast-container');
    if (!container) return;
    const el = document.createElement('div');
    const bg = type === 'error' ? 'bg-rose-600' : type === 'info' ? 'bg-slate-800' : 'bg-emerald-600';
    el.className = `${bg} text-white px-4 py-3 rounded-2xl shadow-lg text-xs font-bold flex items-center gap-2 pointer-events-auto transition-all`;
    el.innerHTML = `<span>${type === 'error' ? '⚠️' : '✅'}</span><span>${msg}</span>`;
    container.appendChild(el);
    setTimeout(() => {
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 250);
    }, 3000);
}

function openModal(title, html) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-body').innerHTML = html;
    const backdrop = document.getElementById('modal-backdrop');
    backdrop.classList.remove('hidden');
    backdrop.classList.add('flex');
}

function closeModal() {
    const backdrop = document.getElementById('modal-backdrop');
    backdrop.classList.add('hidden');
    backdrop.classList.remove('flex');
}

function toggleSidebar() {
    const sb = document.getElementById('sidebar');
    const ov = document.getElementById('sidebar-overlay');
    sb.classList.toggle('-translate-x-full');
    ov.classList.toggle('hidden');
}

function formatMoney(val) {
    const n = Number(val) || 0;
    return n > 0 ? n.toLocaleString('vi-VN') + ' đ' : '0 đ';
}

function formatMoneyInput(input) {
    const raw = input.value.replace(/\D/g, '');
    input.value = raw ? Number(raw).toLocaleString('vi-VN') : '';
}

function parseMoneyInput(val) {
    return Number(String(val || '').replace(/\D/g, '')) || 0;
}

function getStatusBadge(status) {
    const map = {
        'Chờ xử lý': 'bg-orange-100 text-orange-800 border-orange-200',
        'Đang sửa': 'bg-amber-100 text-amber-800 border-amber-200',
        'Sửa xong': 'bg-emerald-100 text-emerald-800 border-emerald-200',
        'Gửi trả chi nhánh': 'bg-blue-100 text-blue-800 border-blue-200',
        'Gửi nhà cung cấp': 'bg-purple-100 text-purple-800 border-purple-200',
        'Thanh lý': 'bg-slate-200 text-slate-800 border-slate-300'
    };
    const cls = map[status] || 'bg-slate-100 text-slate-700 border-slate-200';
    return `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-[11px] font-bold border ${cls}">${status}</span>`;
}

// ============================================================================
// 4. HEADER & ĐIỀU HƯỚNG TRANG
// ============================================================================
function updateHeaderUI() {
    const nameEl = document.getElementById('header-user-name');
    const roleEl = document.getElementById('header-user-role');
    const avatarEl = document.getElementById('header-user-avatar');
    const authBtn = document.getElementById('header-auth-btn');
    const settingsBtn = document.getElementById('nav-settings-btn');

    if (currentUser) {
        nameEl.textContent = currentUser.name;
        roleEl.textContent = currentUser.role;
        avatarEl.textContent = currentUser.name.slice(0, 2).toUpperCase();
        avatarEl.className = 'w-10 h-10 rounded-full bg-blue-600 text-white font-extrabold text-xs flex items-center justify-center ring-2 ring-white shadow-xs';
        authBtn.textContent = 'Đăng xuất';
        authBtn.onclick = logoutUser;
        authBtn.className = 'px-3.5 py-2 text-xs font-bold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-xl transition-all';
    } else {
        nameEl.textContent = 'Khách (Chưa đăng nhập)';
        roleEl.textContent = 'Chỉ xem số liệu';
        avatarEl.textContent = '?';
        avatarEl.className = 'w-10 h-10 rounded-full bg-slate-100 text-slate-600 font-extrabold text-xs flex items-center justify-center ring-2 ring-white shadow-xs';
        authBtn.textContent = 'Đăng ký / Đăng nhập';
        authBtn.onclick = () => openAuthModal('login');
        authBtn.className = 'px-3.5 py-2 text-xs font-bold text-white bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 rounded-xl shadow-xs shadow-blue-500/20 transition-all';
    }

    if (settingsBtn) {
        if (isAdmin()) {
            settingsBtn.classList.remove('hidden');
        } else {
            settingsBtn.classList.add('hidden');
            if (currentPage === 'settings') currentPage = 'dashboard';
        }
    }
}

function navigate(page) {
    if (page === 'settings' && !isAdmin()) {
        page = 'dashboard';
    }
    currentPage = page;

    activeCharts.forEach(c => { try { c.destroy(); } catch (e) {} });
    activeCharts = [];

    document.querySelectorAll('.nav-item').forEach(btn => {
        const active = btn.dataset.page === page;
        if (active) {
            btn.classList.add('bg-blue-50', 'text-blue-700', 'font-extrabold');
            btn.classList.remove('text-slate-600', 'hover:bg-slate-50');
        } else {
            btn.classList.remove('bg-blue-50', 'text-blue-700', 'font-extrabold');
            btn.classList.add('text-slate-600', 'hover:bg-slate-50');
        }
    });

    const sb = document.getElementById('sidebar');
    const ov = document.getElementById('sidebar-overlay');
    if (window.innerWidth < 1024 && sb && !sb.classList.contains('-translate-x-full')) {
        sb.classList.add('-translate-x-full');
        ov.classList.add('hidden');
    }

    const main = document.getElementById('main-content');
    if (page === 'dashboard') main.innerHTML = renderDashboard();
    else if (page === 'computers') main.innerHTML = renderComputers();
    else if (page === 'repairs') main.innerHTML = renderRepairs();
    else if (page === 'regions') main.innerHTML = renderRegions();
    else if (page === 'employees') main.innerHTML = renderEmployees();
    else if (page === 'reports') {
        main.innerHTML = renderReports();
        initReportCharts();
    } else if (page === 'settings') main.innerHTML = renderSettings();
}

// ============================================================================
// 5. TRANG CHỦ (DASHBOARD)
// ============================================================================
function renderDashboard() {
    const total = computers.length;
    const pending = computers.filter(c => c.status === 'Chờ xử lý').length;
    const repairing = computers.filter(c => c.status === 'Đang sửa').length;
    const done = computers.filter(c => c.status === 'Sửa xong').length;
    const returned = computers.filter(c => c.status === 'Gửi trả chi nhánh').length;
    const vendor = computers.filter(c => c.status === 'Gửi nhà cung cấp').length;
    const disposed = computers.filter(c => c.status === 'Thanh lý').length;

    const regions = ['Miền Bắc', 'Miền Trung', 'Miền Nam'];

    return `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
                <h2 class="text-xl font-extrabold text-slate-800">Tổng quan Hệ thống Máy tính 3 Miền</h2>
                <p class="text-xs text-slate-500 mt-0.5">Theo dõi trạng thái sửa chữa, bảo hành và điều phối thiết bị theo thời gian thực</p>
            </div>
            ${isAdmin() ? `
                <button onclick="openFaultyInputModal()" class="px-4 py-2.5 rounded-2xl bg-amber-500 hover:bg-amber-600 text-white font-extrabold text-xs shadow-sm transition-all flex items-center gap-2 self-start">
                    <span>⚠️</span> <span>NHẬP MÁY LỖI</span>
                </button>
            ` : `
                <span class="px-3.5 py-2 rounded-xl bg-slate-100 text-slate-600 text-xs font-semibold">
                    👁️ Chế độ chỉ xem số liệu
                </span>
            `}
        </div>

        <!-- KPI CARDS -->
        <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-3">
            <div class="card-elevated p-4 rounded-2xl">
                <div class="text-[11px] font-bold text-slate-500 uppercase">Tổng thiết bị</div>
                <div class="text-2xl font-extrabold text-slate-800 mt-1">${total}</div>
            </div>
            <div class="card-elevated p-4 rounded-2xl border-l-4 border-l-orange-500">
                <div class="text-[11px] font-bold text-orange-700 uppercase">Chờ xử lý</div>
                <div class="text-2xl font-extrabold text-orange-600 mt-1">${pending}</div>
            </div>
            <div class="card-elevated p-4 rounded-2xl border-l-4 border-l-amber-500">
                <div class="text-[11px] font-bold text-amber-700 uppercase">Đang sửa</div>
                <div class="text-2xl font-extrabold text-amber-600 mt-1">${repairing}</div>
            </div>
            <div class="card-elevated p-4 rounded-2xl border-l-4 border-l-emerald-500">
                <div class="text-[11px] font-bold text-emerald-700 uppercase">Sửa xong</div>
                <div class="text-2xl font-extrabold text-emerald-600 mt-1">${done}</div>
            </div>
            <div class="card-elevated p-4 rounded-2xl border-l-4 border-l-blue-500">
                <div class="text-[11px] font-bold text-blue-700 uppercase">Gửi trả CN</div>
                <div class="text-2xl font-extrabold text-blue-600 mt-1">${returned}</div>
            </div>
            <div class="card-elevated p-4 rounded-2xl border-l-4 border-l-purple-500">
                <div class="text-[11px] font-bold text-purple-700 uppercase">Gửi NCC</div>
                <div class="text-2xl font-extrabold text-purple-600 mt-1">${vendor}</div>
            </div>
            <div class="card-elevated p-4 rounded-2xl border-l-4 border-l-slate-500">
                <div class="text-[11px] font-bold text-slate-600 uppercase">Thanh lý</div>
                <div class="text-2xl font-extrabold text-slate-700 mt-1">${disposed}</div>
            </div>
        </div>

        <!-- 3 REGIONS SUMMARY -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            ${regions.map(reg => {
                const list = computers.filter(c => c.region === reg);
                const regRepair = list.filter(c => c.status === 'Đang sửa').length;
                const regDone = list.filter(c => c.status === 'Sửa xong').length;
                return `
                    <div class="card-elevated p-5 rounded-3xl space-y-3">
                        <div class="flex items-center justify-between">
                            <span class="font-extrabold text-slate-800 text-sm">🏢 ${reg}</span>
                            <span class="px-2.5 py-1 rounded-full bg-blue-50 text-blue-700 text-xs font-extrabold">${list.length} máy</span>
                        </div>
                        <p class="text-[11px] text-slate-500 leading-relaxed">${REGION_INFO[reg].branches[0]}</p>
                        <div class="pt-2 border-t border-slate-100 flex items-center justify-between text-xs">
                            <span class="text-amber-600 font-bold">Đang sửa: ${regRepair}</span>
                            <span class="text-emerald-600 font-bold">Sửa xong: ${regDone}</span>
                        </div>
                    </div>
                `;
            }).join('')}
        </div>

        <!-- RECENT DEVICES -->
        <div class="card-elevated rounded-3xl overflow-hidden">
            <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
                <h3 class="font-extrabold text-slate-800 text-sm">Danh sách Máy tiếp nhận gần đây</h3>
                <button onclick="navigate('computers')" class="text-xs font-bold text-blue-600 hover:underline">Xem tất cả →</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                    <thead>
                        <tr class="bg-slate-50 text-slate-500 uppercase text-[11px] border-b border-slate-100">
                            <th class="py-3 px-4 font-bold">Mã số máy</th>
                            <th class="py-3 px-4 font-bold">Loại máy</th>
                            <th class="py-3 px-4 font-bold">Khách hàng</th>
                            <th class="py-3 px-4 font-bold">Chi nhánh</th>
                            <th class="py-3 px-4 font-bold">Tình trạng lỗi</th>
                            <th class="py-3 px-4 font-bold">Trạng thái</th>

function submitFaultyMachine(e) {
    e.preventDefault();
    if (!requireAdmin()) return;

    const code = document.getElementById('fm-code').value.trim();
    if (!/^\d{1,5}$/.test(code)) {
        showToast('Mã số máy phải từ 1 đến 5 chữ số!', 'error');
        return;
    }

    const model = document.getElementById('fm-model').value;
    const customer = document.getElementById('fm-customer').value.trim();
    const region = document.getElementById('fm-region').value;
    const technician = document.getElementById('fm-tech').value;
    const cost = parseMoneyInput(document.getElementById('fm-cost').value);
    const issue = document.getElementById('fm-issue').value.trim();
    const confirmDate = document.getElementById('fm-confirm-date').value || new Date().toISOString().split('T')[0];
    const doneDate = document.getElementById('fm-done-date').value || '';
    const note = document.getElementById('fm-note').value.trim();

    const existingIdx = computers.findIndex(c => c.code.toLowerCase() === code.toLowerCase());
    if (existingIdx !== -1) {
        computers[existingIdx].model = model;
        computers[existingIdx].customer = customer || computers[existingIdx].customer;
        computers[existingIdx].region = region;
        computers[existingIdx].status = 'Chờ xử lý';
        computers[existingIdx].issue = issue;
        computers[existingIdx].confirmDate = confirmDate;
        computers[existingIdx].doneDate = doneDate;
        computers[existingIdx].note = note;
        computers[existingIdx].cost = cost;
        computers[existingIdx].technician = technician;
    } else {
        computers.push({
            id: 'COMP-' + Date.now(),
            code,
            model,
            customer,
            region,
            status: 'Chờ xử lý',
            issue,
            confirmDate,
            doneDate,
            note,
            cost,
            technician,
            createdAt: confirmDate
        });
    }

    saveData();
    closeModal();
    showToast(`Đã tiếp nhận máy lỗi ${code} (${model}) - Chờ xử lý`);
    navigate(currentPage);
}

function saveComputerDetail(e, id) {
    e.preventDefault();
    if (!requireAdmin()) return;

    const comp = computers.find(c => c.id === id);
    if (!comp) return;

    comp.status = document.getElementById('ed-status').value;
    comp.model = document.getElementById('ed-model').value;
    comp.customer = document.getElementById('ed-customer').value.trim();
    comp.region = document.getElementById('ed-region').value;
    comp.technician = document.getElementById('ed-tech').value;
    comp.cost = parseMoneyInput(document.getElementById('ed-cost').value);
    comp.issue = document.getElementById('ed-issue').value.trim();
    comp.confirmDate = document.getElementById('ed-confirm-date').value;
    comp.note = document.getElementById('ed-note').value.trim();
    comp.doneDate = document.getElementById('ed-done-date').value;

    saveData();
    closeModal();
    showToast(`Đã cập nhật thông tin máy ${comp.code}`);
    navigate(currentPage);
}

function deleteComputer(id) {
    if (!requireAdmin()) return;
    computers = computers.filter(c => c.id !== id);
    saveData();
    closeModal();
    showToast('Đã xóa thiết bị khỏi hệ thống', 'info');
    navigate(currentPage);
}

function adminAddAccount(e) {
    e.preventDefault();
    if (!requireAdmin()) return;

    const name = document.getElementById('adm-new-name').value.trim();
    const username = document.getElementById('adm-new-username').value.trim().toLowerCase();
    const password = document.getElementById('adm-new-password').value;
    const role = document.getElementById('adm-new-role').value;
    const region = document.getElementById('adm-new-region').value;
    const phone = document.getElementById('adm-new-phone').value.trim();

    if (employees.some(emp => emp.username.toLowerCase() === username)) {
        showToast('Tên đăng nhập đã tồn tại!', 'error');
        return;
    }

    employees.push({
        id: 'TV-' + Date.now(),
        name,
        username,
        password,
        role,
        region,
        phone,
        registeredAt: new Date().toISOString().split('T')[0]
    });

    saveData();
    showToast(`Đã tạo tài khoản ${name}`);
    openManageAccountsModal();
    if (currentPage === 'employees') navigate('employees');
}

function adminSaveAccount(id) {
    if (!requireAdmin()) return;
    const emp = employees.find(e => e.id === id);
    if (!emp) return;

    emp.name = document.getElementById(`acc-name-${id}`).value.trim() || emp.name;
    emp.password = document.getElementById(`acc-pass-${id}`).value || emp.password;
    emp.role = document.getElementById(`acc-role-${id}`).value;
    emp.region = document.getElementById(`acc-region-${id}`).value;
    emp.phone = document.getElementById(`acc-phone-${id}`).value.trim();

    if (currentUser && currentUser.id === emp.id) {
        currentUser = { ...emp };
        updateHeaderUI();
    }

    saveData();
    showToast(`Đã cập nhật tài khoản ${emp.name}`);
    if (currentPage === 'employees') navigate('employees');
}

function adminDeleteAccount(id) {
    if (!requireAdmin()) return;
    if (currentUser && currentUser.id === id) {
        showToast('Không thể tự xóa tài khoản đang đăng nhập!', 'error');
        return;
    }
    employees = employees.filter(e => e.id !== id);
    saveData();
    showToast('Đã xóa tài khoản thành viên', 'info');
    openManageAccountsModal();
    if (currentPage === 'employees') navigate('employees');
}

            </div>
            <div class="card-elevated p-5 rounded-3xl">
                <h3 class="font-extrabold text-slate-800 text-sm mb-4">Số lượng thiết bị theo 3 Miền</h3>
                <div class="h-64"><canvas id="chart-region"></canvas></div>
            </div>
        </div>
    `;
}

function initReportCharts() {
    const statusCtx = document.getElementById('chart-status');
    const regionCtx = document.getElementById('chart-region');

    if (statusCtx && typeof Chart !== 'undefined') {
        activeCharts.push(new Chart(statusCtx, {
            type: 'doughnut',
            data: {
                labels: MANAGED_STATUSES,
                datasets: [{
                    data: MANAGED_STATUSES.map(st => computers.filter(c => c.status === st).length),
                    backgroundColor: ['#f97316', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#64748b']
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        }));
    }

    if (regionCtx && typeof Chart !== 'undefined') {
        const regs = ['Miền Bắc', 'Miền Trung', 'Miền Nam'];
        activeCharts.push(new Chart(regionCtx, {
            type: 'bar',
            data: {
                labels: regs,
                datasets: [{
                    label: 'Số lượng máy',
                    data: regs.map(r => computers.filter(c => c.region === r).length),
                    backgroundColor: ['#2563eb', '#0ea5e9', '#6366f1'],
                    borderRadius: 8
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        }));
    }
}

// ============================================================================
// 12. CÀI ĐẶT HỆ THỐNG (CHỈ QUẢN TRỊ VIÊN)
// ============================================================================
function renderSettings() {
    if (!isAdmin()) return '';
    return `
        <div>
            <h2 class="text-xl font-extrabold text-slate-800">Cài đặt Hệ thống</h2>
            <p class="text-xs text-slate-500 mt-0.5">Quản lý lưu trữ dữ liệu cục bộ và cấu hình hệ thống</p>
        </div>

        <div class="card-elevated p-5 rounded-3xl flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
                <div class="font-extrabold text-slate-800 text-sm">Đặt lại dữ liệu thiết bị</div>
                <div class="text-xs text-slate-500 mt-0.5">Xóa toàn bộ danh sách máy lỗi đã nhập (chỉ áp dụng cho Quản trị viên)</div>
            </div>
            <button onclick="resetAllData()" class="px-4 py-2.5 rounded-2xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-extrabold self-start sm:self-auto">
                🗑️ Xóa toàn bộ dữ liệu máy
            </button>
        </div>
    `;
}

function resetAllData() {
    if (!requireAdmin()) return;
    computers = [];
    repairs = [];
    saveData();
    showToast('Đã xóa toàn bộ dữ liệu thiết bị');
    navigate('dashboard');
}

// ============================================================================
// 13. ĐĂNG NHẬP & ĐĂNG KÝ TÀI KHOẢN
// ============================================================================
function openAuthModal(tab = 'login') {
    const isLogin = tab === 'login';
    openModal(isLogin ? '🔐 Đăng nhập Hệ thống' : '📝 Đăng ký Tài khoản Mới', `
        <div class="space-y-4 text-xs">
            <div class="flex gap-2 p-1 bg-slate-100 rounded-2xl">
                <button type="button" onclick="openAuthModal('login')" class="flex-1 py-2 rounded-xl font-extrabold transition-all ${isLogin ? 'bg-white text-blue-600 shadow-xs' : 'text-slate-500'}">Đăng nhập</button>
                <button type="button" onclick="openAuthModal('register')" class="flex-1 py-2 rounded-xl font-extrabold transition-all ${!isLogin ? 'bg-white text-blue-600 shadow-xs' : 'text-slate-500'}">Đăng ký</button>
            </div>

            ${isLogin ? `
                <form onsubmit="submitAuthLogin(event)" class="space-y-3.5">
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Chọn tài khoản hoặc nhập tên đăng nhập</label>
                        <select id="login-select" onchange="document.getElementById('login-username').value=this.value" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white font-semibold mb-2">
                            <option value="">-- Chọn nhanh tài khoản có sẵn --</option>
                            ${employees.map(emp => `<option value="${emp.username}">${emp.name} (${emp.role})</option>`).join('')}
                        </select>
                        <input type="text" id="login-username" required placeholder="Tên đăng nhập (VD: bacit)..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Mật khẩu *</label>
                        <input type="password" id="login-password" required placeholder="Nhập mật khẩu (mặc định: 123)..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200">
                    </div>
                    <div class="pt-2 flex justify-end gap-2">
                        <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl bg-slate-100 text-slate-700 font-bold">Đóng</button>
                        <button type="submit" class="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-extrabold">Đăng nhập</button>
                    </div>
                </form>
            ` : `
                <form onsubmit="submitAuthRegister(event)" class="space-y-3.5">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block font-bold text-slate-700 mb-1">Họ và tên *</label>
                            <input type="text" id="reg-name" required placeholder="Nguyễn Văn A" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200">
                        </div>
                        <div>
                            <label class="block font-bold text-slate-700 mb-1">Tên đăng nhập *</label>
                            <input type="text" id="reg-username" required placeholder="nguyenvana" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block font-bold text-slate-700 mb-1">Mật khẩu *</label>
                            <input type="password" id="reg-password" required placeholder="Nhập mật khẩu..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200">
                        </div>
                        <div>
                            <label class="block font-bold text-slate-700 mb-1">Vai trò</label>
                            <select id="reg-role" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white font-semibold">
                                <option value="Thành viên">Thành viên (Chỉ xem)</option>
                                <option value="Quản trị viên">Quản trị viên</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block font-bold text-slate-700 mb-1">Khu vực</label>
                            <select id="reg-region" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white font-semibold">
                                <option value="Miền Bắc">Miền Bắc</option>
                                <option value="Miền Trung">Miền Trung</option>
                                <option value="Miền Nam">Miền Nam</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-bold text-slate-700 mb-1">Số điện thoại</label>
                            <input type="text" id="reg-phone" placeholder="09xxxxxxxx" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200">
                        </div>
                    </div>
                    <div class="pt-2 flex justify-end gap-2">
                        <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl bg-slate-100 text-slate-700 font-bold">Đóng</button>
                        <button type="submit" class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold">Hoàn tất Đăng ký</button>
                    </div>
                </form>
            `}
        </div>
    `);
}

function submitAuthLogin(e) {
    e.preventDefault();
    const username = document.getElementById('login-username').value.trim().toLowerCase();
    const password = document.getElementById('login-password').value;

    const found = employees.find(emp => emp.username.toLowerCase() === username && (emp.password || '123') === password);
    if (!found) {
        showToast('Sai tên đăng nhập hoặc mật khẩu!', 'error');
        return;
    }

    currentUser = { ...found };
    saveData();
    updateHeaderUI();
    closeModal();
    showToast(`Xin chào ${currentUser.name} (${currentUser.role})`);
    navigate(currentPage);
}

function submitAuthRegister(e) {
    e.preventDefault();
    const name = document.getElementById('reg-name').value.trim();
    const username = document.getElementById('reg-username').value.trim().toLowerCase();
    const password = document.getElementById('reg-password').value;
    const role = document.getElementById('reg-role').value;
    const region = document.getElementById('reg-region').value;
    const phone = document.getElementById('reg-phone').value.trim();

    if (employees.some(emp => emp.username.toLowerCase() === username)) {
        showToast('Tên đăng nhập đã được sử dụng!', 'error');
        return;
    }

    const newEmp = {
        id: 'TV-' + Date.now(),
        name,
        username,
        password,
        role,
        region,
        phone,
        registeredAt: new Date().toISOString().split('T')[0]
    };

    employees.push(newEmp);
    currentUser = { ...newEmp };
    saveData();
    updateHeaderUI();
    closeModal();
    showToast(`Đăng ký thành công! Đã đăng nhập với quyền ${role}`);
    navigate(currentPage);
}

function logoutUser() {
    currentUser = null;
    saveData();
    updateHeaderUI();
    showToast('Đã đăng xuất khỏi tài khoản', 'info');
    navigate('dashboard');
}
