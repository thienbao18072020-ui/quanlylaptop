<!DOCTYPE html>
<html lang="vi">
<head>

    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 45%, #f1f5f9 100%);
            color: #0f172a;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Smooth card hover & subtle animations */
        .glass-header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .card-elevated {
            background: #ffffff;
            border: 1px solid rgba(226, 232, 240, 0.9);
            box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.04), 0 2px 6px -1px rgba(15, 23, 42, 0.02);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }
        .card-elevated:hover {
            box-shadow: 0 12px 28px -4px rgba(15, 23, 42, 0.08), 0 4px 10px -2px rgba(15, 23, 42, 0.03);
        }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }

            animation: fadeSlideUp 0.25s ease-out;

        @media print {

            main { margin: 0 !important; padding: 0 !important; width: 100% !important; }

</head>
<body class="antialiased selection:bg-blue-100 selection:text-blue-900">

    <div class="flex h-screen overflow-hidden">

                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>

            <!-- Navigation Menu -->
            <div class="px-6 pt-5 pb-2 text-[10px] font-bold uppercase tracking-widest text-slate-500">

                <button onclick="navigate('regions')" data-page="regions" class="nav-item w-full flex items-center gap-3 px-3.5 py-3 rounded-xl transition-all text-left">

                <button onclick="navigate('settings')" data-page="settings" class="nav-item w-full flex items-center gap-3 px-3.5 py-3 rounded-xl transition-all text-left">

            <!-- Footer Info -->

<script>
// ============================================================================
// 1. DỮ LIỆU & TRẠNG THÁI HỆ THỐNG
// ============================================================================
const STORAGE_KEY = 'vntech_it_3mien_v26';

const REGION_INFO = {
    'Miền Bắc': {
        branches: ['Lô D3, KCN Đại Đồng - Hoàn Sơn, Xã Đại Đồng, Tỉnh Bắc Ninh'],
        itManager: 'Bắc IT (0945633345), Bình IT (0939348848)'
    },
    'Miền Trung': {
        branches: ['Thôn Phong Nam, Quốc Lộ 1A, Phường Hoà Xuân, TP. Đà Nẵng'],
        itManager: 'Bắc IT (0945633345), Bình IT (0939348848)'
    },
    'Miền Nam': {
        branches: ['18/49 Quốc Lộ 1A, Khu Phố 1, Phường Bình Hưng Hoà, TP.HCM'],
        itManager: 'Bắc IT (0945633345), Bình IT (0939348848)'
    }
};

let computers = [];
let repairs = [];
let ioTransactions = [];
let employees = [
    { id: 'TV001', name: 'Bắc IT', username: 'bacit', dept: 'Hạ tầng IT', role: 'Quản trị viên', email: 'bac.it@vntech.vn', phone: '0945633345', region: 'Miền Bắc', status: 'Đang hoạt động', registeredAt: '2026-01-01' },
    { id: 'TV002', name: 'Bình IT', username: 'binhit', dept: 'Kỹ thuật IT', role: 'Quản trị viên', email: 'binh.it@vntech.vn', phone: '0939348848', region: 'Miền Nam', status: 'Đang hoạt động', registeredAt: '2026-01-01' }
];
let currentUser = null;

function isAdmin() {
    return !!(currentUser && currentUser.role === 'Quản trị viên');
}

function requireAdmin() {
    if (!isAdmin()) {
        showToast('Chỉ tài khoản Quản trị viên đăng nhập mới được phép thực hiện thao tác này!', 'warning');
        return false;
    }
    return true;
}

let currentPage = 'dashboard';
let computerFilters = { search: '', region: 'ALL', status: 'ALL' };
let quickSearchQuery = '';
let quickStatusFilter = 'ALL';
let activeCharts = [];

function loadState() {
    try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed.computers)) computers = parsed.computers;
            if (Array.isArray(parsed.repairs)) repairs = parsed.repairs;
            if (Array.isArray(parsed.ioTransactions)) ioTransactions = parsed.ioTransactions;
            if (Array.isArray(parsed.employees) && parsed.employees.length > 0) employees = parsed.employees;
            if (parsed.currentUser !== undefined) currentUser = parsed.currentUser;
        }
    } catch (e) {
        console.warn('Không thể tải dữ liệu lưu trữ:', e);
    }
    updateHeaderUserUI();
}

function saveState() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ computers, repairs, ioTransactions, employees, currentUser }));
    } catch (e) {
        console.warn('Không thể lưu dữ liệu:', e);
    }
}

function updateHeaderUserUI() {
    const nameEl = document.getElementById('header-user-name');
    const roleEl = document.getElementById('header-user-role');
    const avatarEl = document.getElementById('header-user-avatar');
    const authBtn = document.getElementById('header-auth-btn');
    if (currentUser) {
        if (nameEl) nameEl.textContent = currentUser.name;
        if (roleEl) roleEl.textContent = currentUser.role;
        if (avatarEl) {
            const parts = currentUser.name.trim().split(' ');
            avatarEl.textContent = parts[parts.length - 1].slice(0, 2).toUpperCase();
            avatarEl.className = isAdmin()
                ? 'w-10 h-10 rounded-full bg-gradient-to-br from-blue-600 to-indigo-600 text-white font-extrabold text-xs flex items-center justify-center ring-2 ring-blue-100 shadow-xs'
                : 'w-10 h-10 rounded-full bg-slate-200 text-slate-700 font-extrabold text-xs flex items-center justify-center ring-2 ring-white shadow-xs';
        }
        if (authBtn) {
            authBtn.textContent = 'Tài khoản / Đăng xuất';
            authBtn.className = 'px-3.5 py-2 text-xs font-bold text-slate-700 bg-slate-100 hover:bg-slate-200/80 rounded-xl transition-all';
        }
    } else {
        if (nameEl) nameEl.textContent = 'Khách (Chưa đăng nhập)';
        if (roleEl) roleEl.textContent = 'Chỉ xem số liệu';
        if (avatarEl) {
            avatarEl.textContent = '?';
            avatarEl.className = 'w-10 h-10 rounded-full bg-slate-100 text-slate-500 font-extrabold text-xs flex items-center justify-center ring-2 ring-white';
        }
        if (authBtn) {
            authBtn.textContent = 'Đăng ký / Đăng nhập';
            authBtn.className = 'px-3.5 py-2 text-xs font-bold text-white bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 rounded-xl shadow-xs shadow-blue-500/20 transition-all';
        }
    }
}

// ============================================================================
// 2. TIỆN ÍCH CHUNG (UI, TOAST, MODAL, THỐNG KÊ)
// ============================================================================
function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    sidebar.classList.toggle('-translate-x-full');
    overlay.classList.toggle('hidden');
}

function showToast(message, type = 'success') {
    const container = document.getElementById('toast-container');
    const colors = {
        success: 'bg-emerald-600 text-white',
        warning: 'bg-amber-600 text-white',
        info: 'bg-slate-800 text-white',
        error: 'bg-rose-600 text-white'
    };
    const toast = document.createElement('div');
    toast.className = `${colors[type] || colors.info} px-4 py-3 rounded-xl shadow-lg text-xs font-semibold pointer-events-auto transition-all`;
    toast.textContent = message;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3200);
}

function openModal(title, htmlContent) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-body').innerHTML = htmlContent;
    const backdrop = document.getElementById('modal-backdrop');
    backdrop.classList.remove('hidden');
    backdrop.classList.add('flex');
}

function closeModal() {
    const backdrop = document.getElementById('modal-backdrop');
    backdrop.classList.add('hidden');
    backdrop.classList.remove('flex');
}

function formatCurrencyInput(input) {
    const digits = input.value.replace(/\D/g, '');
    input.value = digits ? Number(digits).toLocaleString('vi-VN') : '';
}

function getStatusBadge(status) {
    const map = {
        'Sửa xong': { dot: '🟢', cls: 'bg-emerald-50 text-emerald-700 border-emerald-200' },
        'Đang sửa': { dot: '🟡', cls: 'bg-amber-50 text-amber-700 border-amber-200' },
        'Đã gửi trả chi nhánh': { dot: '🔵', cls: 'bg-blue-50 text-blue-700 border-blue-200' },
        'Chờ xử lý': { dot: '🟠', cls: 'bg-orange-50 text-orange-700 border-orange-200' },
        'Gửi nhà cung cấp': { dot: '🟣', cls: 'bg-purple-50 text-purple-700 border-purple-200' },
        'Hỏng': { dot: '🔴', cls: 'bg-rose-50 text-rose-700 border-rose-200' },
        'Thanh lý': { dot: '⚫', cls: 'bg-slate-100 text-slate-700 border-slate-300' }
    };
    const item = map[status] || { dot: '⚪', cls: 'bg-slate-50 text-slate-700 border-slate-200' };
    return `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold border ${item.cls}">${item.dot} ${status}</span>`;
}

function getRegionStats(region = null) {
    const list = region ? computers.filter(c => c.region === region) : computers;
    return {
        total: list.length,
        inUse: list.filter(c => c.status === 'Sửa xong').length,
        repairing: list.filter(c => c.status === 'Đang sửa').length,
        pending: list.filter(c => c.status === 'Chờ xử lý').length,
        vendor: list.filter(c => c.status === 'Gửi nhà cung cấp').length,
        inStock: list.filter(c => c.status === 'Đã gửi trả chi nhánh').length,
        broken: list.filter(c => c.status === 'Hỏng').length,
        disposed: list.filter(c => c.status === 'Thanh lý').length,
        importedCount: ioTransactions.filter(t => t.type === 'NHẬP' && (!region || t.region === region)).length,
        exportedCount: ioTransactions.filter(t => t.type === 'XUẤT' && (!region || t.region === region)).length
    };
}

// ============================================================================
// 3. ĐIỀU HƯỚNG TRANG
// ============================================================================
function navigate(page) {
    currentPage = page;
    document.querySelectorAll('.nav-item').forEach(btn => {
        const isActive = btn.getAttribute('data-page') === page;
        btn.className = isActive
            ? 'nav-item w-full flex items-center gap-3 px-3.5 py-3 rounded-xl transition-all text-left bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-md shadow-blue-600/25 font-bold'
            : 'nav-item w-full flex items-center gap-3 px-3.5 py-3 rounded-xl transition-all text-left text-slate-300 hover:bg-slate-800/80 hover:text-white font-medium';
    });

    const sidebar = document.getElementById('sidebar');
    if (sidebar && !sidebar.classList.contains('-translate-x-full') && window.innerWidth < 1024) {
        toggleSidebar();
    }
    renderCurrentPage();
}

function renderCurrentPage() {
    activeCharts.forEach(c => { try { c.destroy(); } catch (e) {} });
    activeCharts = [];

    const main = document.getElementById('main-content');
    if (!main) return;
    main.classList.remove('animate-page');
    void main.offsetWidth;
    main.classList.add('animate-page');

    switch (currentPage) {
        case 'dashboard': renderDashboard(main); break;
        case 'computers': renderComputers(main); break;
        case 'repairs': renderRepairs(main); break;
        case 'io': renderIO(main); break;
        case 'regions': renderRegions(main); break;
        case 'employees': renderEmployees(main); break;
        case 'reports': renderReports(main); break;
        case 'settings': renderSettings(main); break;
        default: renderDashboard(main);
    }
}

// ============================================================================
// 4. TRANG CHỦ (DASHBOARD + TRA CỨU NHANH + AI ANALYTICS)
// ============================================================================
function renderRegionMiniCard(region) {
    const stats = getRegionStats(region);
    const accentMap = {
        'Miền Bắc': { badge: 'bg-blue-50 text-blue-700 border-blue-200/80', bar: 'from-blue-600 to-indigo-600' },
        'Miền Trung': { badge: 'bg-indigo-50 text-indigo-700 border-indigo-200/80', bar: 'from-indigo-500 to-purple-600' },
        'Miền Nam': { badge: 'bg-sky-50 text-sky-700 border-sky-200/80', bar: 'from-sky-500 to-blue-600' }
    };
    const theme = accentMap[region] || accentMap['Miền Bắc'];

    return `
        <div class="card-elevated rounded-2xl overflow-hidden flex flex-col justify-between">
            <div class="h-1.5 w-full bg-gradient-to-r ${theme.bar}"></div>
            <div class="p-5 space-y-4">
                <div class="flex items-center justify-between">
                    <span class="px-3 py-1 rounded-xl border ${theme.badge} font-extrabold text-xs tracking-wide">🏢 ${region.toUpperCase()}</span>
                    <button onclick="computerFilters.region='${region}'; navigate('computers')" class="text-xs font-bold text-blue-600 hover:text-blue-800 flex items-center gap-1 transition-colors">
                        Chi tiết <span>→</span>
                    </button>
                </div>
                <div class="flex items-baseline justify-between border-b border-slate-100 pb-3.5">
                    <span class="text-xs text-slate-500 font-semibold">Tổng số máy quản lý</span>
                    <span class="text-3xl font-extrabold text-slate-900 tracking-tight">${stats.total}</span>
                </div>
                <div class="grid grid-cols-2 gap-2.5 text-xs">
                    <div class="flex items-center justify-between p-2.5 rounded-xl bg-emerald-50/80 border border-emerald-100 text-emerald-800">
                        <span class="font-medium">🟢 Sửa xong</span><strong class="text-sm">${stats.inUse}</strong>
                    </div>
                    <div class="flex items-center justify-between p-2.5 rounded-xl bg-amber-50/80 border border-amber-100 text-amber-800">
                        <span class="font-medium">🟡 Đang sửa</span><strong class="text-sm">${stats.repairing}</strong>
                    </div>
                    <div class="flex items-center justify-between p-2.5 rounded-xl bg-orange-50/80 border border-orange-100 text-orange-800">
                        <span class="font-medium">🟠 Chờ xử lý</span><strong class="text-sm">${stats.pending}</strong>
                    </div>
                    <div class="flex items-center justify-between p-2.5 rounded-xl bg-blue-50/80 border border-blue-100 text-blue-800">
                        <span class="font-medium">🔵 Trả chi nhánh</span><strong class="text-sm">${stats.inStock}</strong>
                    </div>
                    <div class="flex items-center justify-between p-2.5 rounded-xl bg-purple-50/80 border border-purple-100 text-purple-800">
                        <span class="font-medium">🟣 Gửi NCC</span><strong class="text-sm">${stats.vendor}</strong>
                    </div>
                    <div class="flex items-center justify-between p-2.5 rounded-xl bg-slate-100/90 border border-slate-200/80 text-slate-800">
                        <span class="font-medium">⚫ Thanh lý</span><strong class="text-sm">${stats.disposed}</strong>
                    </div>
                </div>
            </div>
        </div>
    `;
}

function buildAIInsights() {
    const regions = ['Miền Bắc', 'Miền Trung', 'Miền Nam'];
    const regionCosts = regions.map(reg => {
        const regCompIds = new Set(computers.filter(c => c.region === reg).map(c => c.id));
        const costFromRepairs = repairs
            .filter(r => r.region === reg || regCompIds.has(r.computerId))
            .reduce((sum, r) => sum + (Number(r.cost) || 0), 0);
        return costFromRepairs;
    });
    const totalCost = regionCosts.reduce((a, b) => a + b, 0);

    const total = computers.length;
    const problemCount = computers.filter(c => ['Đang sửa', 'Chờ xử lý', 'Gửi nhà cung cấp', 'Hỏng'].includes(c.status)).length;
    const repeatedRepairMachines = computers.filter(c => {
        const count = repairs.filter(r => r.computerId === c.id).length;
        return count >= 2 || c.status === 'Hỏng';
    });

    let riskScore = 0;
    if (total > 0) {
        const problemRatio = problemCount / total;
        riskScore = Math.min(100, Math.round(problemRatio * 60 + repeatedRepairMachines.length * 12 + (totalCost > 10000000 ? 20 : totalCost > 3000000 ? 10 : 0)));
    }
    const riskLevel = riskScore >= 65
        ? { label: 'Rủi ro Cao', badge: 'bg-rose-50 text-rose-700 border-rose-200' }
        : riskScore >= 30
            ? { label: 'Rủi ro Trung bình', badge: 'bg-amber-50 text-amber-700 border-amber-200' }
            : { label: 'An toàn / Ổn định', badge: 'bg-emerald-50 text-emerald-700 border-emerald-200' };

    const allIssues = [
        ...computers.map(c => `${c.issue || ''} ${c.note || ''}`),
        ...repairs.map(r => `${r.issue || ''} ${r.note || ''}`)
    ].join(' ').toLowerCase();

    const upgrades = [];
    if (allIssues.includes('pin') || allIssues.includes('sạc')) {
        upgrades.push('Thay thế lô Pin OEM mới cho các dòng máy lưu động để giảm 45% sự cố gián đoạn nguồn.');
    }
    if (allIssues.includes('ổ cứng') || allIssues.includes('ssd') || allIssues.includes('chậm') || allIssues.includes('ram')) {
        upgrades.push('Nâng cấp đồng bộ SSD NVMe & RAM 16GB giúp tăng 35% hiệu suất xử lý và kéo dài vòng đời máy thêm 2 năm.');
    }
    if (allIssues.includes('màn hình') || allIssues.includes('bàn phím')) {
        upgrades.push('Trang bị túi chống sốc & quy chuẩn bàn giao thiết bị tại chi nhánh để giảm hư hỏng vật lý.');
    }
    if (upgrades.length === 0) {
        upgrades.push('Duy trì lịch bảo dưỡng định kỳ 6 tháng/lần và chuẩn hóa linh kiện dự phòng giữa 2 dòng HP & LENOVO để tối ưu chi phí kho.');
    }

    return { regions, regionCosts, totalCost, riskScore, riskLevel, repeatedRepairMachines, upgrades };
}

function handleQuickSearch(val) {
    quickSearchQuery = val.trim();
    if (quickSearchQuery) {
        quickStatusFilter = 'ALL';
    }
    renderQuickSearchResults();
}

function toggleQuickStatus(status) {
    quickStatusFilter = quickStatusFilter === status ? 'ALL' : status;
    renderCurrentPage();
}

function renderQuickSearchResults() {
    const box = document.getElementById('quick-search-results');
    if (!box) return;

    if (!quickSearchQuery && quickStatusFilter === 'ALL') {
        box.innerHTML = '';
        return;
    }

    const q = quickSearchQuery.toLowerCase();
    const matchedMap = new Map();

    computers.forEach(c => {
        const latestRepair = [...repairs].reverse().find(r => r.computerId === c.id);
        matchedMap.set(c.id, {
            id: c.id,
            user: c.user || (latestRepair && latestRepair.customer) || '-',
            issue: c.issue || (latestRepair && latestRepair.issue) || '-',
            cost: Number(c.cost || (latestRepair && latestRepair.cost) || 0),
            status: c.status
        });
    });

    repairs.forEach(r => {
        if (!matchedMap.has(r.computerId)) {
            matchedMap.set(r.computerId, {
                id: r.computerId,
                user: r.customer || '-',
                issue: r.issue || '-',
                cost: Number(r.cost || 0),
                status: r.status || 'Chờ xử lý'
            });
        }
    });

    const results = Array.from(matchedMap.values()).filter(item => {
        const matchQuery = !q || String(item.id).toLowerCase().includes(q) || String(item.user).toLowerCase().includes(q);
        const matchStatus = quickStatusFilter === 'ALL' || item.status === quickStatusFilter;
        return matchQuery && matchStatus;
    });

    if (results.length === 0) {
        box.innerHTML = `<div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200 text-xs text-slate-500 text-center">Không tìm thấy mã số máy phù hợp.</div>`;
        return;
    }

    box.innerHTML = results.map(item => `
        <div onclick="openComputerDetail('${item.id}')" class="cursor-pointer p-3.5 rounded-xl border border-slate-200 hover:border-blue-400 hover:bg-blue-50/30 transition-all flex flex-wrap items-center justify-between gap-3">
            <div class="space-y-1 text-xs">
                <div class="flex flex-wrap items-center gap-2">
                    <span class="font-bold text-blue-600 text-sm">Mã số máy: ${item.id}</span>
                    <span class="text-slate-300">•</span>
                    <span class="text-slate-700">Khách hàng: <strong>${item.user}</strong></span>
                </div>
                <div class="flex flex-wrap items-center gap-2 text-slate-600">
                    <span>Tình trạng lỗi: <strong>${item.issue}</strong></span>
                    <span class="text-slate-300">•</span>
                    <span>Chi phí dự kiến: <strong class="text-amber-700">${item.cost.toLocaleString('vi-VN')} VND</strong></span>
                </div>
            </div>
            <div>${getStatusBadge(item.status)}</div>
        </div>
    `).join('');
}

            name: rep.brand || 'HP',
            user: rep.customer || '-',
            region: rep.region || 'Miền Bắc',
            status: rep.status || 'Chờ xử lý',
            issue: rep.issue || '-',

function saveDetailEdits(id) {
    if (!requireAdmin()) return;
    const issueEl = document.getElementById('detail-edit-issue');
    const regionEl = document.getElementById('detail-edit-region');
    const costEl = document.getElementById('detail-edit-cost');
    if (!issueEl || !regionEl || !costEl) return;

    const newIssue = issueEl.value.trim();
    const newRegion = regionEl.value;
    const newCost = Number(costEl.value.replace(/\D/g, '')) || 0;
    const todayStr = new Date().toLocaleDateString('vi-VN');

    const comp = computers.find(c => c.id === id);
    if (comp) {
        comp.issue = newIssue || comp.issue;
        comp.region = newRegion;
        comp.cost = newCost;
        comp.history = comp.history || [];
        comp.history.push({
            date: todayStr,
            text: `Cập nhật thông tin: Lỗi "${comp.issue}" • Khu vực ${newRegion} • Chi phí dự kiến ${newCost.toLocaleString('vi-VN')} VND`
        });
    }

    const latestRepair = [...repairs].reverse().find(r => r.computerId === id);
    if (latestRepair) {
        latestRepair.issue = newIssue || latestRepair.issue;
        latestRepair.region = newRegion;
        latestRepair.cost = newCost;
    }

    saveState();
    renderCurrentPage();
    openComputerDetail(id);
    showToast(`Đã lưu chỉnh sửa cho mã số máy ${id}`);
}

function quickChangeStatus(id, newStatus, reopenModal = true) {
    if (!requireAdmin()) return;
    const comp = computers.find(c => c.id === id);
    if (!comp) return;
    const todayStr = new Date().toLocaleDateString('vi-VN');
    comp.status = newStatus;
    comp.history = comp.history || [];

    if (newStatus === 'Đã gửi trả chi nhánh') {
        comp.history.push({ date: todayStr, text: `Gửi trả chi nhánh & nhập kho khu vực ${comp.region}` });
        ioTransactions.unshift({
            id: `PN-${Date.now().toString().slice(-5)}`,
            type: 'NHẬP',
            computerId: comp.id,
            region: comp.region,
            person: comp.user || 'Kho chi nhánh',
            date: new Date().toISOString().slice(0, 10),
            note: `Gửi trả chi nhánh ${comp.region} sau xử lý`
        });
    } else {
        comp.history.push({ date: todayStr, text: `Thao tác nhanh: Chuyển sang trạng thái "${newStatus}"` });
    }

    repairs.forEach(r => {
        if (r.computerId === id) {
            r.status = newStatus;
        }
    });

    saveState();
    renderCurrentPage();
    showToast(`Đã cập nhật mã số máy ${id} sang "${newStatus}"`);
    if (reopenModal) openComputerDetail(id);
}

function submitNewRepair(e) {
    e.preventDefault();
    if (!requireAdmin()) return;
    const id = document.getElementById('rep-comp-id').value.trim();
    const brand = document.getElementById('rep-brand').value;
    const region = document.getElementById('rep-region').value;
    const customer = document.getElementById('rep-customer').value.trim();
    const issue = document.getElementById('rep-issue').value.trim();
    const note = document.getElementById('rep-note').value.trim();
    const cost = Number(document.getElementById('rep-cost').value.replace(/\D/g, '')) || 0;
    const date = document.getElementById('rep-date').value || new Date().toISOString().slice(0, 10);
    const tech = document.getElementById('rep-tech').value.trim() || 'Bắc IT';

    if (!id) {
        showToast('Vui lòng nhập mã số máy!', 'error');
        return;
    }

    const todayStr = new Date().toLocaleDateString('vi-VN');
    const historyNote = `Tiếp nhận máy lỗi (${brand}) - Chờ xử lý tại ${region} (KH: ${customer}): ${issue}${note ? ' • Ghi chú: ' + note : ''}`;

    let existing = computers.find(c => c.id === id);
    if (existing) {
        existing.name = brand;
        existing.region = region;
        existing.user = customer;
        existing.status = 'Chờ xử lý';
        existing.issue = issue;
        existing.note = note;
        existing.cost = cost;
        existing.history = existing.history || [];
        existing.history.push({ date: todayStr, text: historyNote });
    } else {
        computers.unshift({
            id,
            name: brand,
            user: customer,
            region,
            status: 'Chờ xử lý',
            issue,
            note,
            cost,
            importDate: date,
            history: [{ date: todayStr, text: historyNote }]
        });
    }

    repairs.unshift({
        id: `SC-${Date.now().toString().slice(-5)}`,
        computerId: id,
        brand,
        region,
        customer,
        issue,
        note,
        cost,

function submitNewComputer(e) {
    e.preventDefault();
    const id = document.getElementById('comp-id').value.trim();
    const name = document.getElementById('comp-brand').value;
    const user = document.getElementById('comp-user').value.trim() || '-';
    const region = document.getElementById('comp-region').value;
    const status = document.getElementById('comp-status').value;
    const importDate = document.getElementById('comp-date').value;

    if (computers.some(c => c.id === id)) {
        showToast(`Mã số máy ${id} đã tồn tại!`, 'warning');
        return;
    }

    computers.unshift({
        id, name, user, region, status, importDate,
        history: [{ date: new Date().toLocaleDateString('vi-VN'), text: `Thêm mới thiết bị (${name}) tại ${region}` }]
    });

    saveState();
    closeModal();
    renderCurrentPage();
    showToast(`Đã thêm mã số máy ${id} thành công!`);
}

function submitIOForm(e) {
    e.preventDefault();
    const type = document.getElementById('io-type').value;
    const computerId = document.getElementById('io-comp-id').value.trim();
    const region = document.getElementById('io-region').value;
    const person = document.getElementById('io-person').value.trim();
    const date = document.getElementById('io-date').value;
    const note = document.getElementById('io-note').value.trim();

    ioTransactions.unshift({
        id: `${type === 'NHẬP' ? 'PN' : 'PX'}-${Date.now().toString().slice(-5)}`,
        type, computerId, region, person, date, note
    });

    const comp = computers.find(c => c.id === computerId);
    if (comp) {
        comp.region = region;
        comp.status = type === 'NHẬP' ? 'Đã gửi trả chi nhánh' : 'Sửa xong';
        if (type === 'XUẤT') comp.user = person;
        comp.history = comp.history || [];
        comp.history.push({ date: new Date().toLocaleDateString('vi-VN'), text: `Phiếu ${type} tại ${region} (${person})` });
    }

    saveState();
    closeModal();
    renderCurrentPage();
    showToast(`Đã tạo phiếu ${type} cho mã số máy ${computerId}`);
}

                    data: [st.inUse, st.inStock, st.repairing, st.pending, st.broken + st.disposed],
                    backgroundColor: ['#10b981', '#3b82f6', '#f59e0b', '#f97316', '#64748b']
                }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
        }));
    }
}

function exportCSVReport() {
    const header = ['STT', 'Ma so may', 'Ten may', 'Khach hang', 'Mien', 'Tinh trang', 'Ngay nhap'];
    const rows = computers.map((c, i) => [i + 1, c.id, c.name, c.user, c.region, c.status, c.importDate]);
    const csvContent = '\uFEFF' + [header, ...rows].map(r => r.map(v => `"${String(v || '').replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `Bao_Cao_May_Tinh_3_Mien_${new Date().toISOString().slice(0, 10)}.csv`;
    link.click();
    showToast('Đã xuất tệp báo cáo Excel (CSV)!');
}

function submitAuthLogin(e) {
    e.preventDefault();
    const selectedId = document.getElementById('auth-login-select').value;
    const found = employees.find(emp => emp.id === selectedId);
    if (!found) return;
    currentUser = found;
    saveState();
    updateHeaderUserUI();
    closeModal();
    renderCurrentPage();
    showToast(`Xin chào ${found.name} (${found.role})!`);
}

function submitAuthRegister(e) {
    e.preventDefault();
    const name = document.getElementById('reg-name').value.trim();
    const username = document.getElementById('reg-username').value.trim();
    const role = document.getElementById('reg-role').value;
    const region = document.getElementById('reg-region').value;
    const dept = document.getElementById('reg-dept').value.trim() || 'Thành viên';
    const phone = document.getElementById('reg-phone').value.trim() || '-';
    const email = document.getElementById('reg-email').value.trim() || '-';

    if (employees.some(emp => (emp.username || '').toLowerCase() === username.toLowerCase())) {
        showToast('Tên đăng nhập đã tồn tại, vui lòng chọn tên khác!', 'warning');
        return;
    }

    const newMember = {
        id: `TV${String(employees.length + 1).padStart(3, '0')}`,
        name,
        username,
        dept,
        role,
        email,
        phone,
        region,
        status: 'Đang hoạt động',
        registeredAt: new Date().toISOString().slice(0, 10)
    };

    employees.push(newMember);
    currentUser = newMember;
    saveState();
    updateHeaderUserUI();
    closeModal();
    renderCurrentPage();
    showToast(`Đăng ký thành công tài khoản ${name} (${role})!`);
}

function logoutUser() {
    currentUser = null;
    saveState();
    updateHeaderUserUI();
    closeModal();
    renderCurrentPage();
    showToast('Đã đăng xuất tài khoản (Chế độ chỉ xem).', 'info');
}

function saveAccountEdit(empId) {
    if (!requireAdmin()) return;
    const emp = employees.find(e => e.id === empId);
    if (!emp) return;

    const newName = document.getElementById(`edit-emp-name-${empId}`).value.trim();
    const newRole = document.getElementById(`edit-emp-role-${empId}`).value;
    const newRegion = document.getElementById(`edit-emp-region-${empId}`).value;
    const newPhone = document.getElementById(`edit-emp-phone-${empId}`).value.trim();

    if (!newName) {
        showToast('Họ tên thành viên không được để trống!', 'warning');
        return;
    }

    emp.name = newName;
    emp.role = newRole;
    emp.region = newRegion;
    emp.phone = newPhone || '-';

    if (currentUser && currentUser.id === emp.id) {
        currentUser = emp;
        updateHeaderUserUI();
    }

    saveState();
    renderCurrentPage();
    openManageAccountsModal();
    showToast(`Đã cập nhật thông tin tài khoản ${emp.name}!`);
}

function deleteAccountMember(empId) {
    if (!requireAdmin()) return;
    if (currentUser && currentUser.id === empId) {
        showToast('Không thể xóa tài khoản đang đăng nhập!', 'warning');
        return;
    }
    const target = employees.find(e => e.id === empId);
    if (!target) return;

    employees = employees.filter(e => e.id !== empId);
    saveState();
    renderCurrentPage();
    openManageAccountsModal();
    showToast(`Đã xóa tài khoản ${target.name} (${target.id})!`, 'info');
}
