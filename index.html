<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Máy Tính 3 Miền - IT Asset Management</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->

    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }

            background: #ffffff;
        }

            aside, header, .no-print { display: none !important; }

</head>
<body class="antialiased selection:bg-blue-100 selection:text-blue-900">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2.5 pointer-events-none"></div>

    <!-- Mobile Sidebar Overlay -->
    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/50 z-30 hidden lg:hidden backdrop-blur-xs transition-opacity"></div>

    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-white border-r border-slate-200 text-slate-700 flex flex-col transform -translate-x-full lg:translate-x-0 lg:static transition-transform duration-200 ease-in-out">
            <!-- Brand Logo -->
            <div class="h-16 flex items-center gap-3 px-5 border-b border-slate-100 shrink-0">
                <div class="w-9 h-9 rounded-xl bg-blue-600 text-white flex items-center justify-center font-extrabold text-sm shadow-xs">
                    IT
                </div>
                <div>
                    <div class="font-extrabold text-slate-800 tracking-wide text-sm">HỆ THỐNG IT</div>
                    <div class="text-[11px] text-slate-400 font-medium">Quản lý Tài sản 3 Miền</div>
                </div>
            </div>

            <!-- Navigation Menu -->
            <nav id="sidebar-nav" class="flex-1 overflow-y-auto p-3.5 space-y-1.5 text-xs font-semibold">
                <button onclick="navigate('dashboard')" data-page="dashboard" class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition-all text-left">
                    <span class="text-base">🏠</span> <span>TRANG CHỦ</span>
                </button>
                <button onclick="navigate('computers')" data-page="computers" class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition-all text-left">
                    <span class="text-base">💻</span> <span>QUẢN LÝ MÁY TÍNH</span>
                </button>
                <button onclick="navigate('repairs')" data-page="repairs" class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition-all text-left">
                    <span class="text-base">🔧</span> <span>MÁY ĐANG SỬA</span>
                </button>
                <button onclick="navigate('regions')" data-page="regions" class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition-all text-left">
                    <span class="text-base">🏢</span> <span>QUẢN LÝ 3 MIỀN</span>
                </button>
                <button onclick="navigate('employees')" data-page="employees" class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition-all text-left">
                    <span class="text-base">👥</span> <span>THÀNH VIÊN</span>
                </button>
                <button onclick="navigate('reports')" data-page="reports" class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition-all text-left">
                    <span class="text-base">📊</span> <span>BÁO CÁO</span>
                </button>
                <button onclick="navigate('settings')" data-page="settings" class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition-all text-left">
                    <span class="text-base">⚙️</span> <span>CÀI ĐẶT</span>
                </button>
            </nav>

            <!-- Footer Info -->
            <div class="p-4 border-t border-slate-100 text-[11px] text-slate-400">
                <div>Đồng bộ Bắc • Trung • Nam</div>
            </div>
        </aside>

        <!-- MAIN WORKSPACE -->
        <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
            <!-- TOP HEADER -->
            <header class="h-18 glass-header border-b border-slate-200/80 px-4 sm:px-6 lg:px-8 flex items-center justify-between shrink-0 sticky top-0 z-20">
                <div class="flex items-center gap-3">
                    <button onclick="toggleSidebar()" class="lg:hidden p-2.5 rounded-xl bg-slate-100 hover:bg-slate-200/70 text-slate-700 transition-colors">
                        ☰
                    </button>
                    <div>
                        <h1 class="text-sm sm:text-base lg:text-lg font-extrabold text-slate-800 tracking-tight truncate">
                            HỆ THỐNG QUẢN LÝ MÁY TÍNH 3 MIỀN
                        </h1>
                        <p class="hidden md:block text-[11px] text-slate-500 font-medium">Trung tâm điều phối thiết bị & bảo trì kỹ thuật toàn quốc</p>
                    </div>
                </div>

                <div class="flex items-center gap-3 sm:gap-3.5">
                    <div class="text-right hidden sm:block">
                        <div id="header-user-name" class="text-xs font-bold text-slate-800">Khách (Chưa đăng nhập)</div>
                        <div id="header-user-role" class="text-[11px] text-slate-500 font-medium">Chỉ xem số liệu</div>
                    </div>
                    <div id="header-user-avatar" class="w-10 h-10 rounded-full bg-slate-100 text-slate-600 font-extrabold text-xs flex items-center justify-center ring-2 ring-white shadow-xs">
                        ?
                    </div>
                    <button id="header-auth-btn" onclick="openAuthModal('login')" class="px-3.5 py-2 text-xs font-bold text-white bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 rounded-xl shadow-xs shadow-blue-500/20 transition-all">
                        Đăng ký / Đăng nhập
                    </button>
                </div>
            </header>

            <!-- MAIN CONTENT AREA -->
            <main id="main-content" class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 space-y-6"></main>
        </div>
    </div>

    <!-- MODAL OVERLAY -->
    <div id="modal-backdrop" onclick="if(event.target===this) closeModal()" class="fixed inset-0 bg-slate-900/60 z-50 hidden items-center justify-center p-4 backdrop-blur-xs transition-opacity">
        <div class="bg-white rounded-3xl border border-slate-200/90 shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden animate-page">
            <div class="px-6 py-4 border-b border-slate-200/80 flex items-center justify-between bg-gradient-to-r from-slate-50 to-blue-50/40">
                <h3 id="modal-title" class="font-extrabold text-slate-800 text-base">Chi tiết</h3>
                <button onclick="closeModal()" class="w-8 h-8 rounded-xl hover:bg-slate-200/70 text-slate-500 font-bold flex items-center justify-center transition-colors">✕</button>
            </div>
            <div id="modal-body" class="p-6 overflow-y-auto"></div>
        </div>
    </div>

<script>
// ============================================================================
// 1. DỮ LIỆU & TRẠNG THÁI HỆ THỐNG
// ============================================================================
const STORAGE_KEY = 'vntech_it_3mien_v26';

const REGION_INFO = {
    'Miền Bắc': {
        branches: ['Lô D3, KCN Đại Đồng - Hoàn Sơn, Xã Đại Đồng, Tỉnh Bắc Ninh'],
        itManager: 'Bắc IT (0945633345), Bình IT (0939348848)'
    },
    'Miền Trung': {
        branches: ['Thôn Phong Nam, Quốc Lộ 1A, Phường Hoà Xuân, TP. Đà Nẵng'],
        itManager: 'Bắc IT (0945633345), Bình IT (0939348848)'
    },
    'Miền Nam': {
        branches: ['18/49 Quốc Lộ 1A, Khu Phố 1, Phường Bình Hưng Hoà, TP.HCM'],
        itManager: 'Bắc IT (0945633345), Bình IT (0939348848)'
    }
};

let computers = [];
let repairs = [];
let ioTransactions = [];
let employees = [
    { id: 'TV001', name: 'Bắc IT', username: 'bacit', dept: 'Hạ tầng IT', role: 'Quản trị viên', email: 'bac.it@vntech.vn', phone: '0945633345', region: 'Miền Bắc', status: 'Đang hoạt động', registeredAt: '2026-01-01' },
    { id: 'TV002', name: 'Bình IT', username: 'binhit', dept: 'Kỹ thuật IT', role: 'Quản trị viên', email: 'binh.it@vntech.vn', phone: '0939348848', region: 'Miền Nam', status: 'Đang hoạt động', registeredAt: '2026-01-01' }
];
let currentUser = null;

function isAdmin() {
    return !!(currentUser && currentUser.role === 'Quản trị viên');
}

function requireAdmin() {
    if (!isAdmin()) {
        showToast('Chỉ tài khoản Quản trị viên đăng nhập mới được phép thực hiện thao tác này!', 'warning');
        return false;
    }
    return true;
}

let currentPage = 'dashboard';
let computerFilters = { search: '', region: 'ALL', status: 'ALL' };
let quickSearchQuery = '';
let quickStatusFilter = 'ALL';
let activeCharts = [];

function loadState() {
    try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed.computers)) computers = parsed.computers;
            if (Array.isArray(parsed.repairs)) repairs = parsed.repairs;
            if (Array.isArray(parsed.ioTransactions)) ioTransactions = parsed.ioTransactions;
            if (Array.isArray(parsed.employees) && parsed.employees.length > 0) employees = parsed.employees;
            if (parsed.currentUser !== undefined) currentUser = parsed.currentUser;
        }
    } catch (e) {
        console.warn('Không thể tải dữ liệu lưu trữ:', e);
    }
    updateHeaderUserUI();
}

function saveState() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ computers, repairs, ioTransactions, employees, currentUser }));
    } catch (e) {
        console.warn('Không thể lưu dữ liệu:', e);
    }
}

function updateHeaderUserUI() {
    const nameEl = document.getElementById('header-user-name');
    const roleEl = document.getElementById('header-user-role');
    const avatarEl = document.getElementById('header-user-avatar');
    const authBtn = document.getElementById('header-auth-btn');
    if (currentUser) {
        if (nameEl) nameEl.textContent = currentUser.name;
        if (roleEl) roleEl.textContent = currentUser.role;
        if (avatarEl) {
            const parts = currentUser.name.trim().split(' ');
            avatarEl.textContent = parts[parts.length - 1].slice(0, 2).toUpperCase();
            avatarEl.className = isAdmin()
                ? 'w-10 h-10 rounded-full bg-gradient-to-br from-blue-600 to-indigo-600 text-white font-extrabold text-xs flex items-center justify-center ring-2 ring-blue-100 shadow-xs'
                : 'w-10 h-10 rounded-full bg-slate-200 text-slate-700 font-extrabold text-xs flex items-center justify-center ring-2 ring-white shadow-xs';
        }
        if (authBtn) {
            authBtn.textContent = 'Tài khoản / Đăng xuất';
            authBtn.className = 'px-3.5 py-2 text-xs font-bold text-slate-700 bg-slate-100 hover:bg-slate-200/80 rounded-xl transition-all';
        }
    } else {
        if (nameEl) nameEl.textContent = 'Khách (Chưa đăng nhập)';
        if (roleEl) roleEl.textContent = 'Chỉ xem số liệu';
        if (avatarEl) {
            avatarEl.textContent = '?';
            avatarEl.className = 'w-10 h-10 rounded-full bg-slate-100 text-slate-500 font-extrabold text-xs flex items-center justify-center ring-2 ring-white';
        }
        if (authBtn) {
            authBtn.textContent = 'Đăng ký / Đăng nhập';
            authBtn.className = 'px-3.5 py-2 text-xs font-bold text-white bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 rounded-xl shadow-xs shadow-blue-500/20 transition-all';
        }
    }
}

// ============================================================================
// 2. TIỆN ÍCH CHUNG (UI, TOAST, MODAL, THỐNG KÊ)
// ============================================================================
function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    sidebar.classList.toggle('-translate-x-full');
    overlay.classList.toggle('hidden');
}

function showToast(message, type = 'success') {
    const container = document.getElementById('toast-container');
    const colors = {
        success: 'bg-emerald-600 text-white',
        warning: 'bg-amber-600 text-white',
        info: 'bg-slate-800 text-white',
        error: 'bg-rose-600 text-white'
    };
    const toast = document.createElement('div');
    toast.className = `${colors[type] || colors.info} px-4 py-3 rounded-xl shadow-lg text-xs font-semibold pointer-events-auto transition-all`;
    toast.textContent = message;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3200);
}

function openModal(title, htmlContent) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-body').innerHTML = htmlContent;
    const backdrop = document.getElementById('modal-backdrop');
    backdrop.classList.remove('hidden');
    backdrop.classList.add('flex');
}

function closeModal() {
    const backdrop = document.getElementById('modal-backdrop');
    backdrop.classList.add('hidden');
    backdrop.classList.remove('flex');
}

function formatCurrencyInput(input) {
    const digits = input.value.replace(/\D/g, '');
    input.value = digits ? Number(digits).toLocaleString('vi-VN') : '';
}

function getStatusBadge(status) {
    const map = {
        'Sửa xong': { dot: '🟢', cls: 'bg-emerald-50 text-emerald-700 border-emerald-200' },
        'Đang sửa': { dot: '🟡', cls: 'bg-amber-50 text-amber-700 border-amber-200' },
        'Đã gửi trả chi nhánh': { dot: '🔵', cls: 'bg-blue-50 text-blue-700 border-blue-200' },
        'Chờ xử lý': { dot: '🟠', cls: 'bg-orange-50 text-orange-700 border-orange-200' },
        'Gửi nhà cung cấp': { dot: '🟣', cls: 'bg-purple-50 text-purple-700 border-purple-200' },
        'Hỏng': { dot: '🔴', cls: 'bg-rose-50 text-rose-700 border-rose-200' },
        'Thanh lý': { dot: '⚫', cls: 'bg-slate-100 text-slate-700 border-slate-300' }
    };
    const item = map[status] || { dot: '⚪', cls: 'bg-slate-50 text-slate-700 border-slate-200' };
    return `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold border ${item.cls}">${item.dot} ${status}</span>`;
}

function getRegionStats(region = null) {
    const list = region ? computers.filter(c => c.region === region) : computers;
    return {
        total: list.length,
        inUse: list.filter(c => c.status === 'Sửa xong').length,
        repairing: list.filter(c => c.status === 'Đang sửa').length,
        pending: list.filter(c => c.status === 'Chờ xử lý').length,
        vendor: list.filter(c => c.status === 'Gửi nhà cung cấp').length,
        inStock: list.filter(c => c.status === 'Đã gửi trả chi nhánh').length,
        broken: list.filter(c => c.status === 'Hỏng').length,
        disposed: list.filter(c => c.status === 'Thanh lý').length,
        importedCount: ioTransactions.filter(t => t.type === 'NHẬP' && (!region || t.region === region)).length,
        exportedCount: ioTransactions.filter(t => t.type === 'XUẤT' && (!region || t.region === region)).length
    };
}

// ============================================================================
// 3. ĐIỀU HƯỚNG TRANG
// ============================================================================
function navigate(page) {
    currentPage = page;
    document.querySelectorAll('.nav-item').forEach(btn => {
        const isActive = btn.getAttribute('data-page') === page;
        btn.className = isActive
            ? 'nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition-all text-left bg-blue-600 text-white shadow-xs font-bold'
            : 'nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition-all text-left text-slate-600 hover:bg-slate-100 hover:text-slate-900 font-semibold';
    });

    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    if (sidebar && !sidebar.classList.contains('-translate-x-full') && window.innerWidth < 1024) {
        sidebar.classList.add('-translate-x-full');
        overlay.classList.add('hidden');
    }

    activeCharts.forEach(chart => {
        try { chart.destroy(); } catch (e) {}
    });
    activeCharts = [];

    const main = document.getElementById('main-content');
    if (page === 'dashboard') main.innerHTML = renderDashboard();
    else if (page === 'computers') main.innerHTML = renderComputers();
    else if (page === 'repairs') main.innerHTML = renderRepairs();
    else if (page === 'regions') main.innerHTML = renderRegions();
    else if (page === 'employees') main.innerHTML = renderEmployees();
    else if (page === 'reports') main.innerHTML = renderReports();
    else if (page === 'settings') main.innerHTML = renderSettings();

    if (page === 'dashboard') {
        initDashboardCharts();
        renderQuickSearchResults();
    } else if (page === 'reports') {
        initReportCharts();
    }
}

// ============================================================================
// 4. TRANG CHỦ (DASHBOARD)
// ============================================================================
function renderDashboard() {
    const overall = getRegionStats();
    const regions = [
        { name: 'Miền Bắc', accent: 'border-t-blue-500', badge: 'bg-blue-50 text-blue-700' },
        { name: 'Miền Trung', accent: 'border-t-amber-500', badge: 'bg-amber-50 text-amber-700' },
        { name: 'Miền Nam', accent: 'border-t-emerald-500', badge: 'bg-emerald-50 text-emerald-700' }
    ];

    return `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
                <h2 class="text-xl sm:text-2xl font-extrabold text-slate-800">Tổng quan Hệ thống 3 Miền</h2>
                <p class="text-xs text-slate-500 mt-1">Theo dõi trạng thái sửa chữa, bảo hành và luân chuyển thiết bị toàn quốc</p>
            </div>
            ${isAdmin() ? `
                <button onclick="openNewRepairModal()" class="inline-flex items-center justify-center gap-2 px-4 py-2.5 bg-amber-500 hover:bg-amber-600 text-white text-xs font-extrabold rounded-xl shadow-xs transition-all">
                    <span>⚠️</span> <span>NHẬP MÁY LỖI</span>
                </button>
            ` : `
                <span class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-slate-100 text-slate-600 text-xs font-semibold border border-slate-200">
                    🔒 Chế độ xem số liệu (Đăng nhập Quản trị viên để nhập máy lỗi)
                </span>
            `}
        </div>

        <!-- 3 THẺ MIỀN -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
            ${regions.map(r => {
                const st = getRegionStats(r.name);
                return `
                    <div class="card-elevated rounded-2xl border-t-4 ${r.accent} p-5 flex flex-col justify-between space-y-4">
                        <div class="flex items-center justify-between">
                            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-extrabold ${r.badge}">
                                🏢 ${r.name.toUpperCase()}
                            </span>
                            <button onclick="viewRegionDetail('${r.name}')" class="text-xs font-semibold text-slate-500 hover:text-blue-600 transition-colors">
                                Chi tiết →
                            </button>
                        </div>

                        <div class="flex items-baseline justify-between border-b border-slate-100 pb-3">
                            <span class="text-xs font-semibold text-slate-500">Tổng số máy</span>
                            <span class="text-2xl font-extrabold text-slate-800">${st.total}</span>
                        </div>

                        <div class="grid grid-cols-2 gap-2 text-xs font-semibold">
                            <div class="flex items-center justify-between px-3 py-2 rounded-xl bg-emerald-50/70 text-emerald-800 border border-emerald-100">
                                <span>🟢 Sửa xong</span>
                                <span class="font-extrabold">${st.inUse}</span>
                            </div>
                            <div class="flex items-center justify-between px-3 py-2 rounded-xl bg-amber-50/70 text-amber-800 border border-amber-100">
                                <span>🟡 Đang sửa</span>
                                <span class="font-extrabold">${st.repairing}</span>
                            </div>
                            <div class="flex items-center justify-between px-3 py-2 rounded-xl bg-orange-50/70 text-orange-800 border border-orange-100">
                                <span>🟠 Chờ xử lý</span>
                                <span class="font-extrabold">${st.pending}</span>
                            </div>
                            <div class="flex items-center justify-between px-3 py-2 rounded-xl bg-blue-50/70 text-blue-800 border border-blue-100">
                                <span>🔵 Đã gửi trả chi nhánh</span>
                                <span class="font-extrabold">${st.inStock}</span>
                            </div>
                            <div class="flex items-center justify-between px-3 py-2 rounded-xl bg-purple-50/70 text-purple-800 border border-purple-100">
                                <span>🟣 Gửi nhà cung cấp</span>
                                <span class="font-extrabold">${st.vendor}</span>
                            </div>
                            <div class="flex items-center justify-between px-3 py-2 rounded-xl bg-slate-100 text-slate-700 border border-slate-200">
                                <span>⚫ Máy thanh lý</span>
                                <span class="font-extrabold">${st.disposed}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('')}
        </div>

        <!-- TỔNG QUAN TOÀN CÔNG TY -->
        <div class="card-elevated rounded-2xl p-5 space-y-4">
            <div class="flex items-center justify-between">
                <h3 class="text-sm font-extrabold text-slate-800">Tổng quan toàn công ty (3 Miền)</h3>
                <span class="text-xs font-bold text-blue-600 bg-blue-50 px-3 py-1 rounded-full">Tổng: ${overall.total} máy</span>

function setQuickStatusFilter(status) {
    quickStatusFilter = status;
    const sel = document.getElementById('quick-status-select');
    if (sel) sel.value = status;
    renderQuickSearchResults();
}

function renderQuickSearchResults() {
    const container = document.getElementById('quick-search-results');
    if (!container) return;

    const q = quickSearchQuery.trim().toLowerCase();
    const filtered = computers.filter(c => {
        const matchStatus = quickStatusFilter === 'ALL' || c.status === quickStatusFilter;
        const matchQuery = !q ||
            (c.code && c.code.toLowerCase().includes(q)) ||
            (c.name && c.name.toLowerCase().includes(q)) ||
            (c.customer && c.customer.toLowerCase().includes(q)) ||
            (c.region && c.region.toLowerCase().includes(q));
        return matchStatus && matchQuery;
    });

    if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-xs text-slate-400">Chưa có thiết bị nào khớp với điều kiện tìm kiếm.</div>`;
        return;
    }

    container.innerHTML = `
        <table class="w-full text-left border-collapse text-xs">
            <thead>
                <tr class="border-b border-slate-200 text-slate-500 uppercase text-[11px]">
                    <th class="py-2.5 px-3">Mã số máy</th>
                    <th class="py-2.5 px-3">Tên máy</th>
                    <th class="py-2.5 px-3">Khách hàng</th>
                    <th class="py-2.5 px-3">Khu vực</th>
                    <th class="py-2.5 px-3">Tình trạng lỗi</th>
                    <th class="py-2.5 px-3">Trạng thái</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
                ${filtered.map(c => `
                    <tr onclick="openDeviceDetail('${c.id}')" class="hover:bg-blue-50/50 cursor-pointer transition-colors">
                        <td class="py-3 px-3 font-bold text-blue-600">${c.code}</td>
                        <td class="py-3 px-3 font-semibold text-slate-800">${c.name}</td>
                        <td class="py-3 px-3 text-slate-600">${c.customer || '-'}</td>
                        <td class="py-3 px-3 text-slate-600">${c.region}</td>
                        <td class="py-3 px-3 text-slate-600">${c.issue || '-'}</td>
                        <td class="py-3 px-3">${getStatusBadge(c.status)}</td>
                    </tr>
                `).join('')}
            </tbody>
        </table>
    `;
}

function initDashboardCharts() {
    const ctxReg = document.getElementById('chart-regions');
    const ctxStat = document.getElementById('chart-status');
    if (!ctxReg || !ctxStat || typeof Chart === 'undefined') return;

    const rNames = ['Miền Bắc', 'Miền Trung', 'Miền Nam'];
    const regChart = new Chart(ctxReg, {
        type: 'bar',
        data: {
            labels: rNames,
            datasets: [
                { label: 'Chờ xử lý', data: rNames.map(r => getRegionStats(r).pending), backgroundColor: '#f97316', borderRadius: 6 },
                { label: 'Đang sửa', data: rNames.map(r => getRegionStats(r).repairing), backgroundColor: '#eab308', borderRadius: 6 },
                { label: 'Sửa xong', data: rNames.map(r => getRegionStats(r).inUse), backgroundColor: '#22c55e', borderRadius: 6 },
                { label: 'Gửi nhà cung cấp', data: rNames.map(r => getRegionStats(r).vendor), backgroundColor: '#a855f7', borderRadius: 6 },
                { label: 'Đã gửi trả CN', data: rNames.map(r => getRegionStats(r).inStock), backgroundColor: '#3b82f6', borderRadius: 6 }
            ]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { size: 11 } } } } }
    });

    const ov = getRegionStats();
    const statChart = new Chart(ctxStat, {
        type: 'doughnut',
        data: {
            labels: ['Chờ xử lý', 'Đang sửa', 'Sửa xong', 'Gửi nhà cung cấp', 'Đã gửi trả CN', 'Thanh lý'],
            datasets: [{
                data: [ov.pending, ov.repairing, ov.inUse, ov.vendor, ov.inStock, ov.disposed],
                backgroundColor: ['#f97316', '#eab308', '#22c55e', '#a855f7', '#3b82f6', '#475569'],
                borderWidth: 2,
                borderColor: '#ffffff'
            }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { size: 11 } } } } }
    });

    activeCharts.push(regChart, statChart);
}

function saveDetailEdits(compId) {
    if (!requireAdmin()) return;
    const comp = computers.find(c => c.id === compId);
    if (!comp) return;

    const issueEl = document.getElementById('detail-edit-issue');
    const regionEl = document.getElementById('detail-edit-region');
    const costEl = document.getElementById('detail-edit-cost');

    if (issueEl) comp.issue = issueEl.value.trim();
    if (regionEl) comp.region = regionEl.value;
    if (costEl) {
        const numCost = Number(costEl.value.replace(/\D/g, '')) || 0;
        comp.cost = numCost;
    }

    const rep = repairs.find(r => r.computerId === comp.id);
    if (rep) {
        rep.issue = comp.issue;
        rep.region = comp.region;
        rep.cost = comp.cost;
    }

    saveState();
    showToast('Đã lưu chỉnh sửa thông tin thiết bị!', 'success');
    closeModal();
    navigate(currentPage);
}

function quickUpdateDeviceStatus(compId, newStatus) {
    if (!requireAdmin()) return;
    const comp = computers.find(c => c.id === compId);
    if (!comp) return;
    comp.status = newStatus;

    const rep = repairs.find(r => r.computerId === comp.id);
    if (rep) rep.status = newStatus;

    saveState();
    showToast(`Đã chuyển máy ${comp.code} sang trạng thái: ${newStatus}`, 'success');
    closeModal();
    navigate(currentPage);
}

function submitNewRepair(e) {
    e.preventDefault();
    if (!requireAdmin()) return;

    const code = document.getElementById('rep-code').value.trim().toUpperCase();
    const name = document.getElementById('rep-name').value.trim();
    const customer = document.getElementById('rep-customer').value.trim() || 'Nội bộ';
    const region = document.getElementById('rep-region').value;
    const technician = document.getElementById('rep-tech').value;
    const cost = Number(document.getElementById('rep-cost').value.replace(/\D/g, '')) || 0;
    const issue = document.getElementById('rep-issue').value.trim();
    const today = new Date().toISOString().split('T')[0];

    const newCompId = 'COMP_' + Date.now();
    computers.unshift({
        id: newCompId,
        code,
        name,
        customer,
        region,
        status: 'Chờ xử lý',
        issue,
        cost,
        technician,
        date: today
    });

    repairs.unshift({
        id: 'REP_' + Date.now(),
        computerId: newCompId,
        code,
        name,
        customer,
        region,
        issue,
        cost,
        technician,
        status: 'Chờ xử lý',
        date: today
    });

    saveState();
    showToast(`Đã tiếp nhận máy lỗi ${code} (Chờ xử lý)!`, 'success');
    closeModal();
    navigate(currentPage);
}

    const pool = computers.filter(c => targetStatuses.includes(c.status));

    const counts = {
        'Đang sửa': pool.filter(c => c.status === 'Đang sửa').length,
        'Sửa xong': pool.filter(c => c.status === 'Sửa xong').length,

        'Đã gửi trả chi nhánh': pool.filter(c => c.status === 'Đã gửi trả chi nhánh').length,
        'Thanh lý': pool.filter(c => c.status === 'Thanh lý').length

        const matchReg = computerFilters.region === 'ALL' || c.region === computerFilters.region;

    });

    return `

                                </div>
                            ` : `
                                <div class="font-bold text-slate-800 text-sm">${emp.name} <span class="text-xs font-normal text-slate-500">(${emp.role})</span></div>

                            `}
                        </div>

                        ${adminMode ? `
                            <div class="flex items-center gap-2 shrink-0">
                                <button onclick="saveEmployeeEdit('${emp.id}')" class="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-bold">Lưu</button>
                                <button onclick="deleteEmployeeAccount('${emp.id}')" class="px-3 py-1.5 rounded-lg bg-rose-600 hover:bg-rose-700 text-white font-bold">🗑️ Xóa</button>

                        ` : ''}
                    </div>

function saveEmployeeEdit(empId) {
    if (!requireAdmin()) return;
    const emp = employees.find(e => e.id === empId);
    if (!emp) return;

    const nameEl = document.getElementById(`edit-emp-name-${empId}`);
    const roleEl = document.getElementById(`edit-emp-role-${empId}`);
    const phoneEl = document.getElementById(`edit-emp-phone-${empId}`);

    if (nameEl && nameEl.value.trim()) emp.name = nameEl.value.trim();
    if (roleEl) emp.role = roleEl.value;
    if (phoneEl) emp.phone = phoneEl.value.trim();

    if (currentUser && currentUser.id === emp.id) {
        currentUser = { ...emp };
        updateHeaderUserUI();
    }

    saveState();
    showToast(`Đã cập nhật tài khoản ${emp.name}!`, 'success');
    openManageAccountsModal();
    if (currentPage === 'employees') navigate('employees');
}

function deleteEmployeeAccount(empId) {
    if (!requireAdmin()) return;
    if (employees.length <= 1) {
        showToast('Không thể xóa tài khoản cuối cùng trên hệ thống!', 'warning');
        return;
    }
    const target = employees.find(e => e.id === empId);
    employees = employees.filter(e => e.id !== empId);
    if (currentUser && currentUser.id === empId) {
        currentUser = null;
        updateHeaderUserUI();
    }
    saveState();
    showToast(`Đã xóa tài khoản ${target ? target.name : empId}!`, 'info');
    openManageAccountsModal();
    if (currentPage === 'employees') navigate('employees');
}

                        <select id="login-account-id" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white focus:outline-none focus:border-blue-500 font-semibold">
                            ${employees.map(emp => `
                                <option value="${emp.id}">${emp.name} (${emp.role})</option>
                            `).join('')}
                        </select>
                    </div>
                    <button type="submit" class="w-full py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-extrabold shadow-xs">
                        Đăng nhập vào hệ thống
                    </button>
                </form>
            ` : `
                <form onsubmit="submitAuthRegister(event)" class="space-y-3.5">
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Họ và tên hiển thị *</label>
                        <input type="text" id="reg-name" required placeholder="VD: Nguyễn Văn A" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-blue-500">
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block font-bold text-slate-700 mb-1">Tên đăng nhập *</label>
                            <input type="text" id="reg-username" required placeholder="VD: nguyenvana" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block font-bold text-slate-700 mb-1">Số điện thoại</label>
                            <input type="text" id="reg-phone" placeholder="09xxxxxxxx" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-blue-500">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block font-bold text-slate-700 mb-1">Vai trò tài khoản</label>
                            <select id="reg-role" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white focus:outline-none focus:border-blue-500">
                                <option value="Thành viên">Thành viên (Chỉ xem số liệu)</option>
                                <option value="Quản trị viên">Quản trị viên (Toàn quyền)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-bold text-slate-700 mb-1">Khu vực làm việc</label>
                            <select id="reg-region" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white focus:outline-none focus:border-blue-500">
                                <option value="Miền Bắc">Miền Bắc</option>
                                <option value="Miền Trung">Miền Trung</option>
                                <option value="Miền Nam">Miền Nam</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="w-full py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-extrabold shadow-xs">
                        Hoàn tất đăng ký tài khoản
                    </button>
                </form>
            `}
        </div>
    `);
}

function submitAuthLogin(e) {
    e.preventDefault();
    const accId = document.getElementById('login-account-id').value;
    const found = employees.find(emp => emp.id === accId);
    if (!found) return;

    currentUser = { ...found };
    saveState();
    updateHeaderUserUI();
    showToast(`Xin chào ${currentUser.name} (${currentUser.role})!`, 'success');
    closeModal();
    navigate(currentPage);
}

function submitAuthRegister(e) {
    e.preventDefault();
    const name = document.getElementById('reg-name').value.trim();
    const username = document.getElementById('reg-username').value.trim().toLowerCase();
    const phone = document.getElementById('reg-phone').value.trim();
    const role = document.getElementById('reg-role').value;
    const region = document.getElementById('reg-region').value;
    const today = new Date().toISOString().split('T')[0];

    const newEmp = {
        id: 'TV' + String(employees.length + 1).padStart(3, '0'),
        name,
        username,
        role,
        phone,
        region,
        status: 'Đang hoạt động',
        registeredAt: today
    };

    employees.push(newEmp);
    currentUser = { ...newEmp };
    saveState();
    updateHeaderUserUI();
    showToast(`Đăng ký thành công tài khoản ${name} (${role})!`, 'success');
    closeModal();
    navigate(currentPage);
}

function logoutUser() {
    currentUser = null;
    saveState();
    updateHeaderUserUI();
    showToast('Đã đăng xuất. Hệ thống chuyển về chế độ chỉ xem.', 'info');
    closeModal();
    navigate(currentPage);
}

    return `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
                <h2 class="text-xl sm:text-2xl font-extrabold text-slate-800">Báo cáo Tổng hợp & Chi phí Sửa chữa</h2>
                <p class="text-xs text-slate-500 mt-1">Thống kê chi phí dự kiến và hiệu suất xử lý thiết bị 3 miền</p>
            </div>
            <button onclick="window.print()" class="no-print px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold">
                🖨️ In báo cáo
            </button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="card-elevated rounded-2xl p-5">
                <div class="text-xs font-semibold text-slate-500">Tổng thiết bị tiếp nhận</div>
                <div class="text-2xl font-extrabold text-slate-800 mt-1">${computers.length} máy</div>
            </div>
            <div class="card-elevated rounded-2xl p-5">
                <div class="text-xs font-semibold text-slate-500">Tổng chi phí dự kiến</div>
                <div class="text-2xl font-extrabold text-amber-600 mt-1">${totalCost.toLocaleString('vi-VN')} VND</div>
            </div>
            <div class="card-elevated rounded-2xl p-5">
                <div class="text-xs font-semibold text-slate-500">Đã hoàn tất / Gửi trả</div>
                <div class="text-2xl font-extrabold text-emerald-600 mt-1">${computers.filter(c => c.status === 'Sửa xong' || c.status === 'Đã gửi trả chi nhánh').length} máy</div>
            </div>
        </div>

        <div class="card-elevated rounded-2xl p-5">
            <h3 class="text-sm font-extrabold text-slate-800 mb-3">Biểu đồ Chi phí Sửa chữa theo Khu vực (VND)</h3>
            <div class="h-64"><canvas id="chart-report-cost"></canvas></div>
        </div>
    `;
}

function initReportCharts() {
    const ctx = document.getElementById('chart-report-cost');
    if (!ctx || typeof Chart === 'undefined') return;
    const rNames = ['Miền Bắc', 'Miền Trung', 'Miền Nam'];
    const costs = rNames.map(r => computers.filter(c => c.region === r).reduce((s, c) => s + (Number(c.cost) || 0), 0));

    const chart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: rNames,
            datasets: [{ label: 'Chi phí dự kiến (VND)', data: costs, backgroundColor: ['#3b82f6', '#f59e0b', '#10b981'], borderRadius: 8 }]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });
    activeCharts.push(chart);
}

function renderSettings() {
    return `
        <div>
            <h2 class="text-xl sm:text-2xl font-extrabold text-slate-800">Cài đặt Hệ thống</h2>
            <p class="text-xs text-slate-500 mt-1">Quản lý lưu trữ dữ liệu cục bộ và cấu hình hệ thống</p>
        </div>

        <div class="card-elevated rounded-2xl p-5 space-y-4 text-xs">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div>
                    <div class="font-bold text-slate-800 text-sm">Đặt lại dữ liệu thiết bị</div>
                    <div class="text-slate-500">Xóa toàn bộ danh sách máy lỗi đã nhập (chỉ áp dụng cho Quản trị viên)</div>
                </div>
                <button onclick="resetAllData()" class="px-4 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold">
                    🗑️ Xóa toàn bộ dữ liệu máy
                </button>
            </div>
        </div>
    `;
}

function resetAllData() {
    if (!requireAdmin()) return;
    computers = [];
    repairs = [];
    ioTransactions = [];
    saveState();
    showToast('Đã xóa toàn bộ dữ liệu máy!', 'info');
    navigate('dashboard');
}
